version: 1
game: dokkaebi
slug: dokkaebi-tangtang-battle-hud
status: pilot
backend: godot_control

target:
  project: "../../../runtime/godot-dokkaebi/project.godot"
  owner_scene: "../../../runtime/godot-dokkaebi/scenes/main.tscn"
  owner_script: "../../../runtime/godot-dokkaebi/scripts/main.gd"
  output:
    scene: "../../../runtime/godot-dokkaebi/scenes/generated/tangtang_battle_hud.tscn"
    theme: "../../../runtime/godot-dokkaebi/themes/generated/dokkaebi_tangtang_battle_hud.tres"
  generation_policy: "Generated from harness/godot recipe; do not hand-edit generated output."

sources:
  ui_system_inventory: "../../../design/dokkaebi/ui-system-inventory.yaml"
  button_system: "../../../design/dokkaebi/button-system.yaml"
  modal_system: "../../../design/dokkaebi/modal-system.yaml"
  color_tokens: "../../../design/dokkaebi/color-tokens.yaml"
  art_direction: "../../../design/dokkaebi/art-direction.yaml"
  layout_tokens: "../../../design/dokkaebi/layout-tokens.yaml"
  component_blueprints: "../../../design/dokkaebi/component-blueprints.yaml"
  component_skins: "../../../design/dokkaebi/component-skins.yaml"
  asset_plan: "../../../design/dokkaebi/asset-plan.yaml"
  concepts:
    - "../../../design/dokkaebi/concepts/dokkaebi_tangtang_ingame_screen_d_autumn_flat.md"
    - "../../../design/dokkaebi/concepts/dokkaebi_tangtang_ingame_screen_c_flat.md"
    - "../../../design/dokkaebi/concepts/dokkaebi_tangtang_ingame_screen_b.md"

blueprint_refs:
  surface: DokkaebiTangTangBattleHud
  sections: [top_hud, wave_track, battle_controls, exp_bar]
  components:
    - BattleTopHud
    - BattleTopStatusTab
    - BattleHeroPanel
    - BattleTimerPanel
    - BattleRunLedger
    - BattlePauseButton
    - BattleWaveTrack
    - BattleJoystickControl
    - BattleActionButtonDock
    - BattleCircularActionButton
    - BattleExpBar
  shared_button_roles:
    - top_icon_button
    - battle_circular_action
    - joystick_control
  shared_modal_sections: []
  color_token_groups:
    - battle_hud_panel
    - battle_action_button
    - battle_progress

screen:
  orientation: portrait_9_16
  reference_size_px: { width: 540, height: 960 }
  safe_area_policy: "Top HUD anchors to 8px visual safe area; bottom controls sit above the 30px EXP bar."

layout:
  anchor: full_rect_overlay
  regions:
    top_hud:
      position_px: { x: 8, y: 8 }
      size_px: { width: 524, height: 90 }
      gap_px: 8
      status_tab_count: 3
      status_tab_height_px: 16
    wave_track:
      position_px: { x: 8, y: 106 }
      size_px: { width: 524, height: 18 }
    battle_controls:
      joystick_position_px: { x: 24, y: 760 }
      action_dock_position_px: { x: 356, y: 742 }
      action_cluster_size_px: { width: 174, height: 170 }
    exp_bar:
      position_px: { x: 28, y: 922 }
      size_px: { width: 484, height: 30 }

assets:
  required_keys:
    - dokkaebi.ui.battle.panel_lacquer_9slice
    - dokkaebi.ui.battle.wave_track_9slice
    - dokkaebi.ui.battle.exp_frame_9slice
    - dokkaebi.ui.battle.circular_action_frame_v1
    - dokkaebi.ui.battle.skill_icons_haeil_v1
    - dokkaebi.ui.battle.resource_icons_v1
    - dokkaebi.ui.battle.hero_portrait_haeil_v1
    - dokkaebi.ui.battle.hero_portrait_frame_v1
    - dokkaebi.ui.battle.top_status_tab_9slice_v1
    - dokkaebi.battle.runtime.native_hud_shapes
  nineslice:
    - key: dokkaebi.ui.battle.panel_lacquer_9slice
      atom: NinePatchPanel
      slice_hints: { left: 24, right: 24, top: 24, bottom: 24 }
      content_insets: { left: 10, right: 10, top: 8, bottom: 8 }
      target_size_px: { width: 188, height: 90 }
    - key: dokkaebi.ui.battle.wave_track_9slice
      atom: NinePatchPanel
      slice_hints: { left: 28, right: 28, top: 8, bottom: 8 }
      content_insets: { left: 14, right: 14, top: 5, bottom: 5 }
      target_size_px: { width: 524, height: 18 }
    - key: dokkaebi.ui.battle.exp_frame_9slice
      atom: NinePatchPanel
      slice_hints: { left: 28, right: 28, top: 10, bottom: 10 }
      content_insets: { left: 96, right: 92, top: 8, bottom: 8 }
      target_size_px: { width: 484, height: 30 }
    - key: dokkaebi.ui.battle.top_status_tab_9slice_v1
      atom: NinePatchPanel
      slice_hints: { left: 32, right: 32, top: 10, bottom: 10 }
      content_insets: { left: 6, right: 6, top: 2, bottom: 2 }
      target_size_px: { width: 112, height: 22 }
  fixed_atoms:
    - key: dokkaebi.ui.battle.circular_action_frame_v1
      usage: circular_action_frame
      display_size_px: { width: 96, height: 96 }
    - key: dokkaebi.ui.battle.skill_icons_haeil_v1
      usage: skill_icon_set
      display_size_px: { width: 52, height: 52 }
    - key: dokkaebi.ui.battle.resource_icons_v1
      usage: ledger_icon_set
      display_size_px: { width: 18, height: 18 }
    - key: dokkaebi.ui.battle.hero_portrait_haeil_v1
      usage: hero_portrait
      display_size_px: { width: 64, height: 64 }
    - key: dokkaebi.ui.battle.hero_portrait_frame_v1
      usage: hero_portrait_frame
      display_size_px: { width: 64, height: 64 }
  native_controls:
    - key: dokkaebi.battle.runtime.native_hud_shapes
      usage: labels_progress_fills_joystick_rings_and_cooldown_rings

control_tree:
  root:
    atom: ScreenRoot
    node_name: Root_DokkaebiTangTangBattleHud
    component: BattleTopHud
    anchors_preset: full_rect
    children:
      - atom: SectionGroup
        node_name: Section_TopHud
        component: BattleTopHud
        layout: absolute_top_safe_area
        position_px: { x: 8, y: 8 }
        size_px: { width: 524, height: 90 }
        children:
          - atom: NinePatchPanel
            node_name: Panel_Hero
            component: BattleHeroPanel
            asset_key: dokkaebi.ui.battle.panel_lacquer_9slice
            slice_hints: { left: 24, right: 24, top: 24, bottom: 24 }
            content_insets: { left: 10, right: 10, top: 8, bottom: 8 }
            position_px: { x: 0, y: 0 }
            size_px: { width: 188, height: 90 }
            children:
              - atom: NinePatchPanel
                slot: tab_backing
                node_name: Panel_HeroStatusTabSkin
                component: BattleTopStatusTab
                asset_key: dokkaebi.ui.battle.top_status_tab_9slice_v1
                variant: gold
                slice_hints: { left: 32, right: 32, top: 10, bottom: 10 }
                content_insets: { left: 6, right: 6, top: 2, bottom: 2 }
                position_px: { x: 74, y: 4 }
                size_px: { width: 100, height: 22 }
              - atom: NativeLabel
                slot: status_tab
                node_name: Text_HeroStatusTab
                component: BattleTopStatusTab
                text_binding_or_text_key: run.top_status_tabs.player
