data_contract:
  content: []
  runtime_state:
    - player.name
    - player.hp
    - player.max_hp
    - run.level
    - run.kills
    - run.enemy_count
    - run.purified
    - run.remaining_time
    - run.stage_label
    - run.top_status_tabs
    - run.wave_progress_ratio
    - run.exp_ratio
    - player.activeSkills
  fixtures:
    - "Use current scripts/main.gd debug_snapshot for smoke until generated Control scene has a fixture binding."
  hardcoding_allowlist:
    - "Skill icon atoms may use a temporary sprite sheet placeholder until gen-ui-assets produces dokkaebi.ui.battle.skill_icons_haeil_v1."
    - "Joystick remains native primitive unless branded joystick art is selected."

validation:
  commands:
    - "python3 harness/tools/design_blueprint_validate.py dokkaebi"
    - "python3 harness/godot/validators/godot_ui_recipe_validate.py --recipe harness/godot/recipes/ui/dokkaebi-tangtang-battle-hud.yaml"
    - "python3 harness/godot/builders/godot_ui_recipe_build.py --recipe harness/godot/recipes/ui/dokkaebi-tangtang-battle-hud.yaml"
    - "godot --headless --path harness/runtime/godot-dokkaebi --import"
    - "godot --headless --path harness/runtime/godot-dokkaebi --scene res://scenes/generated/tangtang_battle_hud.tscn --quit-after 1"
    - "godot --headless --path harness/runtime/godot-dokkaebi --check-only --script res://scripts/main.gd"
    - "godot --headless --path harness/runtime/godot-dokkaebi --script res://scripts/tools/smoke.gd"
