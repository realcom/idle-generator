data_contract:
  content: []
  runtime_state:
    - meta.player_name
    - meta.rank
    - meta.resources
    - meta.mail.unread_count
    - meta.home_events
    - meta.idle_reward
    - meta.training
    - meta.next_stage
    - meta.nav_tabs
  fixtures:
    - "scripts/main.gd owns fixture values for first-pass home smoke and visual capture."
  hardcoding_allowlist:
    - "The first pass may draw courtyard, event icons, and dock icons with Godot primitives until outgame UI assets are generated."

validation:
  commands:
    - "PYTHONPATH=/private/tmp/codex-pydeps-pyyaml python3 harness/tools/design_blueprint_validate.py dokkaebi"
    - "PYTHONPATH=/private/tmp/codex-pydeps-pyyaml python3 harness/godot/validators/godot_ui_recipe_validate.py --recipe harness/godot/recipes/ui/dokkaebi-outgame-home.yaml"
    - "PYTHONPATH=/private/tmp/codex-pydeps-pyyaml python3 harness/godot/builders/godot_ui_recipe_build.py --recipe harness/godot/recipes/ui/dokkaebi-outgame-home.yaml"
    - "godot --headless --path harness/runtime/godot-dokkaebi --import"
    - "godot --headless --path harness/runtime/godot-dokkaebi --scene res://scenes/generated/outgame_home.tscn --quit-after 1"
    - "godot --headless --path harness/runtime/godot-dokkaebi --check-only --script res://scripts/main.gd"
    - "godot --headless --path harness/runtime/godot-dokkaebi --script res://scripts/tools/home_smoke.gd"
  screenshot: "harness/runtime/godot-dokkaebi/screenshots/dokkaebi-outgame-home.png"
  compare_board: "harness/design/dokkaebi/compare/dokkaebi_outgame_home_sections_compare.png"
  blockers:
    - no_unknown_atoms
    - no_missing_asset_keys
    - no_fullscreen_concept_png_implementation
    - native_text_values_not_baked_into_assets
    - generated_texture_assets_must_be_inside_godot_project
