version: 1
game: dokkaebi
slug: dokkaebi-outgame-home
status: pilot
backend: godot_control

target:
  project: "../../../runtime/godot-dokkaebi/project.godot"
  owner_scene: "../../../runtime/godot-dokkaebi/scenes/main.tscn"
  owner_script: "../../../runtime/godot-dokkaebi/scripts/main.gd"
  output:
    scene: "../../../runtime/godot-dokkaebi/scenes/generated/outgame_home.tscn"
    theme: "../../../runtime/godot-dokkaebi/themes/generated/dokkaebi_outgame_home.tres"
  generation_policy: "Generated from harness/godot recipe; do not hand-edit generated output."

sources:
  ui_system_inventory: "../../../design/dokkaebi/ui-system-inventory.yaml"
  button_system: "../../../design/dokkaebi/button-system.yaml"
  modal_system: "../../../design/dokkaebi/modal-system.yaml"
  color_tokens: "../../../design/dokkaebi/color-tokens.yaml"
  art_direction: "../../../design/dokkaebi/art-direction.yaml"
  layout_tokens: "../../../design/dokkaebi/layout-tokens.yaml"
  component_blueprints: "../../../design/dokkaebi/component-blueprints.yaml"
  component_skins: "../../../design/dokkaebi/component-skins.yaml"
  asset_plan: "../../../design/dokkaebi/asset-plan.yaml"
  concepts:
    - "../../../design/dokkaebi/concepts/dokkaebi_outgame_home_tangtang_concept_a.md"

blueprint_refs:
  surface: DokkaebiOutgameHome
  sections: [top_resource_bar, hero_stage, event_rail, progression_cards, sortie_cta, bottom_nav]
  components:
    - HomeProfileButton
    - HomeResourceChip
    - HomeMailButton
    - HomeCourtyardBackdrop
    - HomeHeroFigure
    - HomeEventRail
    - HomeEventCard
    - HomeProgressionCard
    - HomeTrainingCard
    - HomeSortieButton
    - HomeBottomNav
    - HomeBottomTab
  shared_button_roles:
    - outgame_resource_chip
    - outgame_event_card
    - outgame_bottom_tab
    - primary_cta
    - top_icon_button
  shared_modal_sections: []
  color_token_groups:
    - outgame_home

screen:
  orientation: portrait_9_16
  reference_size_px: { width: 540, height: 960 }
  safe_area_policy: "Top resources anchor to 8px visual safe area; bottom nav owns the last 112px; sortie CTA sits above the nav."

layout:
  anchor: full_rect_overlay
  regions:
    top_resource_bar:
      position_px: { x: 10, y: 8 }
      size_px: { width: 520, height: 88 }
      gap_px: 8
    hero_stage:
      position_px: { x: 0, y: 92 }
      size_px: { width: 356, height: 610 }
      hero_bounds_px: { x: 94, y: 230, width: 188, height: 252 }
    event_rail:
      position_px: { x: 368, y: 118 }
      size_px: { width: 158, height: 548 }
      card_size_px: { width: 150, height: 90 }
      gap_px: 10
    progression_cards:
      position_px: { x: 12, y: 656 }
      size_px: { width: 344, height: 172 }
      card_size_px: { width: 164, height: 164 }
      gap_px: 10
    sortie_cta:
      position_px: { x: 360, y: 696 }
      size_px: { width: 168, height: 124 }
    bottom_nav:
      position_px: { x: 0, y: 848 }
      size_px: { width: 540, height: 112 }
      tab_count: 5

assets:
  required_keys:
    - dokkaebi.ui.outgame.parchment_card_9slice
    - dokkaebi.ui.outgame.resource_chip_9slice
    - dokkaebi.ui.outgame.sortie_cta_9slice
    - dokkaebi.ui.outgame.bottom_tab_cell_9slice
    - dokkaebi.ui.outgame.tab_selected_9slice
    - dokkaebi.ui.outgame.icon_set_v1
    - dokkaebi.ui.outgame.topbar_imagegen_v2
    - dokkaebi.ui.outgame.event_cards_imagegen_v2
    - dokkaebi.ui.outgame.command_bar_imagegen_v2
    - dokkaebi.ui.outgame.bottom_nav_imagegen_v2
    - dokkaebi.outgame.background.courtyard_v2
    - dokkaebi.outgame.hero.haeil_lobby_sprite_v1
    - dokkaebi.outgame.hero.haeil_lobby_sprite_v2
    - dokkaebi.outgame.runtime.native_home_shapes
  nineslice:
    - key: dokkaebi.ui.outgame.parchment_card_9slice
      atom: NativePanel
      usage: stylebox_texture
      slice_hints: { left: 24, right: 24, top: 24, bottom: 24 }
      content_insets: { left: 12, right: 12, top: 10, bottom: 10 }
      target_size_px: { width: 150, height: 90 }
    - key: dokkaebi.ui.outgame.resource_chip_9slice
      atom: NativePanel
      usage: stylebox_texture
      slice_hints: { left: 18, right: 18, top: 18, bottom: 18 }
      content_insets: { left: 8, right: 8, top: 6, bottom: 6 }
      target_size_px: { width: 96, height: 46 }
    - key: dokkaebi.ui.outgame.sortie_cta_9slice
      atom: IconButton
      usage: stylebox_texture
      slice_hints: { left: 24, right: 24, top: 24, bottom: 24 }
      content_insets: { left: 14, right: 14, top: 12, bottom: 12 }
      target_size_px: { width: 160, height: 98 }
    - key: dokkaebi.ui.outgame.bottom_tab_cell_9slice
      atom: IconButton
      usage: stylebox_texture
      slice_hints: { left: 18, right: 18, top: 18, bottom: 18 }
      content_insets: { left: 8, right: 8, top: 8, bottom: 8 }
      target_size_px: { width: 108, height: 92 }
    - key: dokkaebi.ui.outgame.tab_selected_9slice
      atom: IconButton
      usage: stylebox_texture
      slice_hints: { left: 18, right: 18, top: 18, bottom: 18 }
      content_insets: { left: 8, right: 8, top: 8, bottom: 8 }
      target_size_px: { width: 104, height: 92 }
  fixed_atoms:
    - key: dokkaebi.ui.outgame.icon_set_v1
      usage: resource_event_and_tab_icon_set
      display_size_px: { width: 34, height: 34 }
    - key: dokkaebi.ui.outgame.topbar_imagegen_v2
      usage: profile_resource_mail_chip_texture_set
      display_size_px: { width: 96, height: 42 }
    - key: dokkaebi.ui.outgame.event_cards_imagegen_v2
      usage: right_rail_event_card_texture_set
      display_size_px: { width: 150, height: 90 }
    - key: dokkaebi.ui.outgame.command_bar_imagegen_v2
      usage: reward_training_sortie_texture_set
      display_size_px: { width: 164, height: 164 }
    - key: dokkaebi.ui.outgame.bottom_nav_imagegen_v2
      usage: tab_icon_texture_set
      display_size_px: { width: 42, height: 42 }
    - key: dokkaebi.outgame.background.courtyard_v2
      usage: imagegen_courtyard_background
      display_size_px: { width: 540, height: 960 }
    - key: dokkaebi.outgame.hero.haeil_lobby_sprite_v1
      usage: haeil_lobby_hero
      display_size_px: { width: 188, height: 252 }
    - key: dokkaebi.outgame.hero.haeil_lobby_sprite_v2
      usage: imagegen_haeil_lobby_hero
      display_size_px: { width: 320, height: 498 }
  native_controls:
    - key: dokkaebi.outgame.runtime.native_home_shapes
      usage: background_panels_cards_cta_dock_labels_progress_and_notification_dots

