version: 1
game: taskstonebar
slug: taskstonebar-status-window
status: draft
backend: godot_control

target:
  project: "../../../runtime/godot-taskstonebar/project.godot"
  owner_scene: "../../../runtime/godot-taskstonebar/scenes/main.tscn"
  owner_script: "../../../runtime/godot-taskstonebar/scripts/main.gd"
  output:
    scene: "../../../runtime/godot-taskstonebar/scenes/generated/status_window.tscn"
    theme: "../../../runtime/godot-taskstonebar/themes/generated/taskstonebar_status_window.tres"
  generation_policy: "Generated from harness/godot recipe; keep this status window independent from main.gd integration until the full overlay is refreshed."

sources:
  ui_system_inventory: "../../../design/taskstonebar/ui-system-inventory.yaml"
  button_system: "../../../design/taskstonebar/button-system.yaml"
  modal_system: "../../../design/taskstonebar/modal-system.yaml"
  color_tokens: "../../../design/taskstonebar/color-tokens.yaml"
  art_direction: "../../../design/taskstonebar/art-direction.yaml"
  layout_tokens: "../../../design/taskstonebar/layout-tokens.yaml"
  component_blueprints: "../../../design/taskstonebar/component-blueprints.yaml"
  component_skins: "../../../design/taskstonebar/component-skins.yaml"
  asset_plan: "../../../design/taskstonebar/asset-plan.yaml"
  concepts:
    - "../../../design/taskstonebar/concepts/status_window_concept_c_tbh_stat_skill_layout.md"

blueprint_refs:
  surface: TaskstonebarFullUiOverlay
  sections: [window_stack]
  components:
    - WindowFrame
    - WindowTitleBar
    - StatusWindow
    - StatusStatScrollPanel
    - StatList
    - StatusSearchButton
    - SkillPointHeader
    - SkillLevelTrack
    - SkillTierRow
    - SkillIconSlot
  shared_button_roles:
    - window_close
    - utility_icon
    - active_stone_slot
  shared_modal_sections:
    - DetailedStatsModal
  color_token_groups:
    - panel
    - progress

screen:
  orientation: standalone_window
  reference_size_px: { width: 458, height: 574 }
  concept_reference_size_px: { width: 458, height: 574 }
  safe_area_policy: "Standalone generated Control scene; it should later be mounted at the left StatusWindow position inside the full desktop overlay."

layout:
  anchor: standalone_control
  regions:
    status_window:
      position_px: { x: 0, y: 0 }
      size_px: { width: 458, height: 574 }
    title_bar:
      position_px: { x: 18, y: 10 }
      size_px: { width: 422, height: 54 }
    stat_scroll_panel:
      position_px: { x: 24, y: 76 }
      size_px: { width: 410, height: 154 }
      content_insets_px: { left: 16, right: 28, top: 34, bottom: 12 }
    skill_point_header:
      position_px: { x: 82, y: 244 }
      size_px: { width: 294, height: 40 }
    skill_tree:
      position_px: { x: 24, y: 296 }
      size_px: { width: 410, height: 248 }
      level_track_px: { x: 0, y: 0, width: 58, height: 248 }
      row_area_px: { x: 70, y: 0, width: 340, height: 248 }

assets:
  required_keys:
    - taskstonebar.ui.window_frame_9slice
    - taskstonebar.ui.window_title_bar_9slice
    - taskstonebar.ui.dark_inner_well_9slice
    - taskstonebar.ui.status_stat_card_9slice
    - taskstonebar.ui.slot_frame_9slice
    - taskstonebar.ui.close_icon
    - taskstonebar.ui.stone_icon_set
    - taskstonebar.ui.resource_icon_set
    - taskstonebar.ui.native_overlay_controls
  nineslice:
    - key: taskstonebar.ui.window_frame_9slice
      atom: NinePatchPanel
      usage: status_window_outer_frame
      godot_usage: nine_patch_rect
      slice_hints: { left: 30, right: 30, top: 34, bottom: 30 }
      content_insets: { left: 18, right: 18, top: 72, bottom: 16 }
      target_size_px: { width: 458, height: 574 }
    - key: taskstonebar.ui.window_title_bar_9slice
      atom: NinePatchPanel
      usage: status_window_title_bar
      godot_usage: nine_patch_rect
      slice_hints: { left: 26, right: 26, top: 18, bottom: 18 }
      content_insets: { left: 40, right: 52, top: 10, bottom: 8 }
      target_size_px: { width: 418, height: 54 }
    - key: taskstonebar.ui.dark_inner_well_9slice
      atom: NinePatchPanel
      usage: stat_scroll_and_skill_row_wells
      godot_usage: nine_patch_rect
      slice_hints: { left: 22, right: 22, top: 22, bottom: 22 }
      content_insets: { left: 14, right: 14, top: 14, bottom: 14 }
      target_size_px: { width: 410, height: 154 }
    - key: taskstonebar.ui.status_stat_card_9slice
      atom: NinePatchPanel
      usage: character_status_stat_card
      godot_usage: nine_patch_rect
      slice_hints: { left: 14, right: 14, top: 14, bottom: 14 }
      content_insets: { left: 16, right: 28, top: 34, bottom: 12 }
      target_size_px: { width: 410, height: 154 }
    - key: taskstonebar.ui.slot_frame_9slice
      atom: NinePatchPanel
      usage: skill_icon_slot
      godot_usage: nine_patch_rect
      slice_hints: { left: 18, right: 18, top: 18, bottom: 18 }
      content_insets: { left: 6, right: 6, top: 6, bottom: 16 }
      target_size_px: { width: 58, height: 58 }
  fixed_atoms:
    - key: taskstonebar.ui.close_icon
      usage: status_window_close_icon
      atom: TextureAtom
      display_size_px: { width: 42, height: 42 }
    - key: taskstonebar.ui.stone_icon_set
      usage: stone_throw_skill_icon
      atom: TextureAtom
      display_size_px: { width: 32, height: 32 }
    - key: taskstonebar.ui.resource_icon_set
      usage: loot_or_bonus_skill_icon
      atom: TextureAtom
      display_size_px: { width: 32, height: 32 }
  native_controls:
    - key: taskstonebar.ui.native_overlay_controls
      usage: stat_labels_values_scrollbar_tick_labels_skill_points_native_shapes

