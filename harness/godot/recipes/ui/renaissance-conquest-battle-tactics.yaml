data_contract:
  runtime_state:
    - shell.mode
    - battle.round
    - battle.context_chips
    - battle.active_officer
    - battle.player_army
    - battle.enemy_army
    - battle.formation_slots
    - battle.selected_skill
    - battle.skills
    - battle.target_preview
  symbolic_bindings:
    battle.context_chips: "BATTLE, FIRENZE, ROUND, WEATHER, WALLS, MORALE, SUPPLY, AP, ADV"
    battle.active_officer: "portrait_cell, name, class, troops, hp, stamina, bond, status, event_note"
    battle.player_army.rows: "six selected-side rows keyed by portrait_cell, name, role, troops, hp_ratio, status"
    battle.enemy_army.rows: "six opposing-side rows keyed by unit_name, role, troops, hp_ratio, threat_status"
    battle.formation_slots: "12 native Control tokens keyed by side, column, lane, unit_name, unit_ground_squad_cell, turn_badge, status_badge, troop_count_chip, hp_ratio, morale_pips, frontline_state"
    battle.turn_order: "Native Control strip of 12 upcoming turns using BattleUnitGroundSquadStrip thumbnails, faction frames, and rank badges over the battlefield."
    battle.selected_skill.prediction_rows: "compact damage, morale, advantage, counter risk, wall bonus"
    battle.skills: "six skill buttons with icon_cell, name, ap_cost, damage, cooldown, state"
  fixtures:
    - Leonardo active officer fixture from scripts/main.gd
    - Player army fixture from scripts/main.gd officers list
    - Enemy army fixture from scripts/main.gd enemy_units list
    - Strike, Guard, Volley, Rally, Scheme, Cannon skill fixture data
    - Florence ally formation and Papal enemy formation fixture data
  hardcoding_allowlist:
    - "v0 keeps battle fixture data inside scripts/main.gd until a Godot data model is introduced."

implementation_notes:
  nine_slice_usage:
    panels: "Use StyleBoxTexture from renaissance.ui.skin_atlas_v1; do not place the full atlas as a visible panel texture."
    buttons: "Use StyleBoxTexture states for mode_tab and battle_skill roles."
    content_insets_source: component-skins.yaml:skins.generated_renaissance_frame_skin.content_insets_px
  texture_atoms:
    - "BattlefieldBackground is a TextureRect cover under native formation slots."
    - "BattleSkillIconStrip, BattleUnitIconStrip, BattleUnitGroundSquadStrip, and OfficerPortraitStrip require runtime AtlasTexture cropping by atlas_cell metadata."
  ornament_layers:
    - "The v1 UI skin atlas keeps brass frame detail inside stretch-safe StyleBoxTexture cells; no separate fixed ornament layer is declared for this surface."

validation:
  commands:
    - "python3 harness/tools/design_blueprint_validate.py renaissance-conquest"
    - "python3 harness/godot/validators/godot_ui_recipe_validate.py --recipe harness/godot/recipes/ui/renaissance-conquest-battle-tactics.yaml"
    - "python3 harness/godot/builders/godot_ui_recipe_build.py --recipe harness/godot/recipes/ui/renaissance-conquest-battle-tactics.yaml"
    - "godot --headless --path harness/runtime/godot-renaissance-conquest --import"
    - "godot --headless --path harness/runtime/godot-renaissance-conquest --scene res://scenes/generated/battle_tactics_stub.tscn --quit-after 1"
    - "godot --headless --path harness/runtime/godot-renaissance-conquest --check-only --script res://scripts/main.gd"
    - "godot --headless --path harness/runtime/godot-renaissance-conquest --script res://scripts/tools/smoke.gd"
  screenshot: harness/runtime/godot-renaissance-conquest/screenshots/strategy-shell-battle.png
  comparison_board: harness/runtime/godot-renaissance-conquest/screenshots/compare/strategy-shell-battle-vs-reference.png
  blockers:
    - "Enemy army rows use native colored pips until an enemy portrait/icon atlas exists."
    - "The generic Godot recipe builder does not yet crop atlas_cell metadata, so runtime AtlasTexture cropping remains script-owned for skill icons and officer portraits."
