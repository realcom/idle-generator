version: 1
game: renaissance-conquest
slug: renaissance-conquest-battle-tactics
status: draft
backend: godot_control

target:
  project: ../../../runtime/godot-renaissance-conquest/project.godot
  owner_scene: ../../../runtime/godot-renaissance-conquest/scenes/main.tscn
  owner_script: ../../../runtime/godot-renaissance-conquest/scripts/main.gd
  output:
    scene: ../../../runtime/godot-renaissance-conquest/scenes/generated/battle_tactics_stub.tscn
    theme: ../../../runtime/godot-renaissance-conquest/themes/generated/battle_tactics.tres
  generation_policy: "Generated from harness/godot recipe; runtime main scene owns interaction and scripted battle board drawing."

sources:
  ui_system_inventory: ../../../design/renaissance-conquest/ui-system-inventory.yaml
  button_system: ../../../design/renaissance-conquest/button-system.yaml
  color_tokens: ../../../design/renaissance-conquest/color-tokens.yaml
  art_direction: ../../../design/renaissance-conquest/art-direction.yaml
  layout_tokens: ../../../design/renaissance-conquest/layout-tokens.yaml
  component_blueprints: ../../../design/renaissance-conquest/component-blueprints.yaml
  component_skins: ../../../design/renaissance-conquest/component-skins.yaml
  asset_plan: ../../../design/renaissance-conquest/asset-plan.yaml
  nine_slice_policy: ../../../runtime/NINE_SLICE_UI.md
  concepts:
    - ../../../design/renaissance-conquest/concepts/strategy-shell-godot-v0.md
  reference_images:
    - ../../../runtime/godot-renaissance-conquest/screenshots/compare/strategy-shell-battle-vs-reference.png
    - ../../../runtime/godot-renaissance-conquest/screenshots/strategy-shell-battle.png

blueprint_refs:
  inventory_surface: BattleTactics
  surface: StrategyShell
  sections: [top_hud, battle_body]
  section_focus: battle_body
  components:
    - StrategyShellRoot
    - SharedUiSkinAtlas
    - TopStrategicHud
    - ModeTabBar
    - BattleArmyList
    - BattleFormationBoard
    - BattlefieldBackground
    - BattleUnitIconStrip
    - BattleUnitGroundSquadStrip
    - BattlePredictionPanel
    - BattleSkillDock
    - BattleSkillIconStrip
    - BattleOfficerDetail
    - OfficerPortraitStrip
  shared_button_roles: [mode_tab, battle_skill]
  shared_modal_sections: []
  color_token_groups: [bg, panel, text, action, faction]
  control_atoms:
    - ScreenRoot
    - SectionGroup
    - NativePanel
    - Grid
    - TextureAtom
    - NativeLabel
    - IconButton

screen:
  orientation: landscape_16_9
  reference_size_px: { width: 1280, height: 720 }
  safe_area_policy: "Fixed desktop 16:9 prototype matching layout-tokens.yaml battle reference."

layout:
  anchor: full_rect
  regions:
    top_hud: { x: 16, y: 12, width: 1248, height: 58 }
    player_army: { x: 16, y: 78, width: 160, height: 470 }
    tactical_board: { x: 188, y: 78, width: 758, height: 470 }
    enemy_army: { x: 958, y: 78, width: 306, height: 470 }
    officer_detail: { x: 16, y: 560, width: 360, height: 148 }
    skill_dock: { x: 388, y: 560, width: 558, height: 148 }
    prediction_panel: { x: 958, y: 560, width: 306, height: 148 }
  gaps_px:
    panel_gap: 12
    skill_button_gap: 8
    stat_row_gap: 6
  formation_grid:
    contract: "2 columns x 3 lanes per side; ally BACK/FRONT then enemy FRONT/BACK."
    lane_order: [TOP, MID, BOTTOM]
    ally_columns: [BACK, FRONT]
    enemy_columns: [FRONT, BACK]
    slot_size_px: { width: 108, height: 82 }
    slot_gap_px: { x: 10, y: 36 }
  text_clamp:
    default: ellipsis
    skill_button: "Two native label lines; clamp long skill names before numeric AP/DMG/CD line."
    prediction_note: "Wrap inside panel body; no baked explanatory text in textures."

assets:
  required_keys:
    - renaissance.ui.native_strategy_shell
    - renaissance.ui.skin_atlas_v1
    - renaissance.battle.background.florence_siege_v1
    - renaissance.battle.skill_icons_v1
    - renaissance.battle.unit_icons_v2
    - renaissance.battle.unit_ground_squads_v3
    - renaissance.battle.formation_grid_v0
    - renaissance.officers.portrait_strip_v1
  nineslice:
    - key: renaissance.ui.skin_atlas_v1
      atom: StyleBoxTexture
      usage: "Theme-owned panel, mode tab, skill button, prediction panel, and officer card states."
      godot_usage: stylebox_texture_atlas
      target_resource: ../../../runtime/godot-renaissance-conquest/themes/generated/battle_tactics.tres
      target_path: ../../../runtime/godot-renaissance-conquest/assets/generated/skins/ui_skin_atlas_v1.png
      source_grid: { columns: 6, rows: 1 }
      style_cells:
        panel_dark: 0
        button_normal_dark: 1
        selected_blue: 2
        selected_war_crimson: 3
        selected_develop_green: 4
        selected_intrigue_violet: 5
      slice_hints: { left: 12, right: 12, top: 12, bottom: 12 }
      content_insets: { left: 8, right: 8, top: 7, bottom: 7 }
      must_not_bake: [labels, numbers, cooldowns, AP costs, prediction values, localized_text]
  fixed_atoms:
    - key: renaissance.battle.background.florence_siege_v1
      usage: battle_board_background
      godot_usage: texture_atom
      target_path: ../../../runtime/godot-renaissance-conquest/assets/generated/battle/florence_siege_battlefield_v1.png
      display_size_px: { width: 758, height: 470 }
    - key: renaissance.battle.skill_icons_v1
      usage: battle_skill_icon_atlas_source
      godot_usage: atlas_texture_source
      target_path: ../../../runtime/godot-renaissance-conquest/assets/generated/skills/battle_skill_icon_strip_v1.png
      source_grid: { columns: 6, rows: 1 }
      display_size_px: { width: 360, height: 64 }
    - key: renaissance.battle.unit_icons_v2
      usage: battle_unit_icon_atlas_source
      godot_usage: atlas_texture_source
      target_path: ../../../runtime/godot-renaissance-conquest/assets/generated/units/battle_unit_icon_strip_v2.png
      source_grid: { columns: 6, rows: 1 }
      display_size_px: { width: 204, height: 34 }
    - key: renaissance.battle.unit_ground_squads_v3
      usage: battle_unit_ground_squad_atlas_source
      godot_usage: atlas_texture_source
      target_path: ../../../runtime/godot-renaissance-conquest/assets/generated/units/battle_unit_ground_squad_strip_v3.png
      source_grid: { columns: 6, rows: 1 }
      display_size_px: { width: 384, height: 64 }
    - key: renaissance.officers.portrait_strip_v1
      usage: battle_army_and_officer_detail_portrait_atlas_source
      godot_usage: atlas_texture_source
      target_path: ../../../runtime/godot-renaissance-conquest/assets/generated/officers/officer_portrait_strip_v1.png
      source_grid: { columns: 6, rows: 1 }
      display_size_px: { width: 92, height: 118 }
  native_controls:
    - key: renaissance.ui.native_strategy_shell
      usage: root_native_control_shell
    - key: renaissance.battle.formation_grid_v0
      usage: scripted_draw_formation_slots_and_target_preview

control_tree:
  root:
    atom: ScreenRoot
    node_name: Root_BattleTacticsStub
    component: StrategyShellRoot
    anchors_preset: full_rect
    children:
      - atom: SectionGroup
        node_name: Section_TopHud
        component: TopStrategicHud
        position_px: { x: 16, y: 12 }
        size_px: { width: 1248, height: 58 }
        children:
          - atom: NativePanel
            node_name: Panel_TopHudSkin
            component: SharedUiSkinAtlas
            stylebox_key: generated_renaissance_frame_skin.panel_dark
            position_px: { x: 0, y: 0 }
            size_px: { width: 1248, height: 58 }
          - atom: IconButton
            node_name: Btn_ModeCampaign
            component: ModeTabBar
            button_role: mode_tab
            text_key: ui.mode.campaign
            position_px: { x: 8, y: 10 }
            touch_size: { width: 112, height: 34 }
          - atom: IconButton
            node_name: Btn_ModeBattle
            component: ModeTabBar
            button_role: mode_tab
            text_key: ui.mode.battle
            state: selected
            position_px: { x: 126, y: 10 }
            touch_size: { width: 112, height: 34 }
          - atom: NativeLabel
            node_name: Text_BattleContext
            component: TopStrategicHud
            text_binding: battle.context_chips
            font_size: 10
            color_token: text.primary
            position_px: { x: 286, y: 18 }
            size_px: { width: 936, height: 22 }

      - atom: SectionGroup
        node_name: Section_PlayerArmyList
        component: BattleArmyList
        position_px: { x: 16, y: 78 }
        size_px: { width: 160, height: 470 }
        children:
          - atom: NativePanel
            node_name: Panel_PlayerArmyList
            component: BattleArmyList
            stylebox_key: generated_renaissance_frame_skin.panel_dark
            position_px: { x: 0, y: 0 }
            size_px: { width: 160, height: 470 }
          - atom: NativeLabel
            node_name: Text_PlayerArmyHeader
            component: BattleArmyList
            text_key: battle.player_army.title
            font_size: 11
            color_token: action.primary
            position_px: { x: 8, y: 8 }
