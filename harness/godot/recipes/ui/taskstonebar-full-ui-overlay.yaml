screen:
  orientation: landscape_desktop_overlay
  reference_size_px: { width: 1586, height: 992 }
  safe_area_policy: "Last 52px are reserved for the OS taskbar motif; generated Control scene must leave empty desktop regions transparent."
  product_metaphor: "Desktop companion app: floating RPG windows above an always-on taskbar combat strip."
  transparency_policy: "No full-screen background fill. Empty pixels between floating windows remain transparent; the combat strip shows the cropped battle ground image while combat sprites, HP, damage, toast, progress, and controls default to 100% visible."
  runtime_modes:
    taskbar_mode: "Workshop windows are collapsed/minimized; bottom combat strip and OS taskbar-safe status remain readable."
    workshop_mode: "Status, inventory, and portal windows expand as desktop-style floating windows above the combat strip."
  modal_policy: "Feed, merge, reward, boss, and sync modals must use desktop-window chrome and preserve taskbar combat context unless they block account/security state."

