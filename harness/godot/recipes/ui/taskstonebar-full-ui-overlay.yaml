  equipment_upgrade_modal:
    component: EquipmentUpgradeModal
    modal_section: EquipmentUpgradeModal
    owner_action: runtime:inventory_item_detail/Btn_ItemDetailUpgrade
    shell:
      atom: ModalShell
      frame_asset_key: taskstonebar.ui.window_frame_9slice
      title_asset_key: taskstonebar.ui.window_title_bar_9slice
