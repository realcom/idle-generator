      compare_board: ../../../design/taskstonebar/qa/skill-detail-modal-compare-iteration-1.png
      pass_conditions:
        - "Clicking a StatusWindow skill slot opens this modal without spending Skill Points."
        - "Skill icon, level chip, auto-equip chip, requirements, current effect, next effect, and footer CTA are separate native regions."
        - "Confirming 학습 or 레벨업 is the only path that consumes Skill Points."
        - "TaskbarCombatStrip remains visible behind the modal."

data_contract:
  content:
    - resources.gold
    - resources.ruby
    - resources.pebble_fragment
    - resources.moss_ore
    - resources.cube_catalyst
    - selected_character
    - inventory.stone_slots
    - skill.selected_item
    - skill.unlock_preview
    - skill.level_preview
    - portal.map_progress
    - combat.snapshot
  runtime_state:
    - ui.focus_window
    - ui.window_stack_collapsed
    - ui.active_modal
    - ui.inventory_tab
    - ui.selected_skill_item_id
    - ui.drag_merge_state
    - equipment.upgrade.can_confirm
    - steam_inventory_sync_state
    - combat.latest_rare_drop
  fixtures:
    - harness/build/taskstonebar/Items.json
    - harness/build/taskstonebar/Units.json
    - harness/build/taskstonebar/Maps.json
  hardcoding_allowlist:
    - "Reference positions and sizes are allowed in this recipe; labels, numbers, cooldowns, and item counts are not."
    - "Portal parchment and combat ground may use cropped concept-derived placeholders until original asset extraction is complete."

validation:
  commands:
    - "python3 harness/tools/design_blueprint_validate.py taskstonebar"
    - "python3 harness/godot/validators/godot_ui_recipe_validate.py --recipe harness/godot/recipes/ui/taskstonebar-full-ui-overlay.yaml"
    - "python3 harness/godot/builders/godot_ui_recipe_build.py --recipe harness/godot/recipes/ui/taskstonebar-full-ui-overlay.yaml"
    - "godot --headless --path harness/runtime/godot-taskstonebar --import"
    - "godot --headless --path harness/runtime/godot-taskstonebar --scene res://scenes/generated/full_ui_overlay.tscn --quit-after 1"
    - "godot --headless --path harness/runtime/godot-taskstonebar --check-only --script res://scripts/main.gd"
    - "godot --headless --path harness/runtime/godot-taskstonebar --script res://scripts/tools/full_ui_overlay_smoke.gd"
    - "godot --headless --path harness/runtime/godot-taskstonebar --script res://scripts/tools/smoke.gd"
    - "godot --path harness/runtime/godot-taskstonebar --script res://scripts/tools/capture_full_ui_overlay.gd"
    - "godot --path harness/runtime/godot-taskstonebar --script res://scripts/tools/capture_equipment_upgrade_modal.gd"
    - "godot --path harness/runtime/godot-taskstonebar --script res://scripts/tools/capture_combat.gd"
  screenshot: harness/runtime/godot-taskstonebar/screenshots/taskstonebar-full-ui-overlay.png
  screenshot_paths:
    full_overlay: harness/runtime/godot-taskstonebar/screenshots/taskstonebar-full-ui-overlay.png
    equipment_upgrade_modal: harness/runtime/godot-taskstonebar/screenshots/taskstonebar-equipment-upgrade-modal.png
    taskbar_combat_strip: harness/runtime/godot-taskstonebar/screenshots/taskstonebar-combat-smoke.png
  blockers:
    - "Korean pixel font, exact resource/stone icon atlas variants, and fixed window ornament extraction need asset pass before visual approval."
    - "Floating windows or modals read as full-screen mobile menus instead of desktop windows with title chrome."
    - "The bottom combat strip cannot remain readable as the minimized/taskbar-mode game surface."
