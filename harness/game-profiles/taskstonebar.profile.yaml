random_option_policy:
  engine_field: "ResourceItem.options / optionCounts"
  steam_constraint: "Steam dynamic properties are not market-visible and are cleared on trade, so market-critical option values must not live only there."
  market_modes:
    sealed_roll:
      description: "미감정 장비/펫/캐릭터. Steam Market 거래 가능. 감정하면 Steam 자산을 소비하고 서버 DB 귀속 인스턴스를 생성."
      marketable: true
      bind_on: reveal
    visible_bucket:
      description: "공격형 S, 드롭형 A 같은 유한 옵션 계열/등급을 이름과 태그로 노출한 Steam 자산."
      marketable: true
      bind_on: equip_or_reroll
    bound_instance:
      description: "정확한 난수 수치, 강화 이력, 재굴림 이력은 서버 DB에 저장. 거래 불가."
      marketable: false
      bind_on: created
  option_identity_axes:
    - slot
    - rarity
    - grade
    - enhancement_band
    - option_family
    - option_tier
    - season
  option_families:
    attack: [AttackPercent, AttackSpeedPercent, CriticalPercent, CriticalDamagePercent]
    farming: [ItemDropPercent, ExpPercent, SellPricePercent, Luck]
    bossing: [BossDamageEfficiencyPercent, BossDamageTakenEfficiencyPercent]
    survival: [HpPercent, DefensePercent, DamageTakenEfficiencyPercent]

steam_inventory:
  itemdef_source: "harness/content/taskstonebar/**/_drafts/*.yaml::_economy.steam"
  itemdef_id_policy: "가능하면 Item.id와 Steam itemdefid를 맞춘다."
  dynamic_properties_policy: "거래/마켓 가치에 필요한 옵션은 dynamic property가 아니라 ItemDef, 태그, 이름으로 고정한다."
  initial_marketable_items: [200101, 200102, 200103]

shop:
  product_costs:
    use: productMaterialItemGroups
    disallow_fields: [priceXtr]

behavior:
  triggerType_map: {}
