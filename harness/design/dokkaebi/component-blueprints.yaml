review_gate:
  pass_conditions:
    - "All active combat HUD sections are represented as semantic sections."
    - "Text, timers, counters, cooldowns, HP, and EXP remain runtime-native."
    - "Godot recipe references only declared component and asset keys."
  blockers:
    - "Full-screen concept PNG is used as implementation."
    - "Combat buttons bake cooldown numbers or Korean labels into generated images."
    - "Top HUD or controls cover the central Haeil readability zone."
