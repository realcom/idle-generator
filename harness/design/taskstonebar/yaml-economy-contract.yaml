formation_policy:
  formation_size:
    min: 1
    max: 4
    launch_target: 3
  drop_model: account_rolls_with_character_contribution
  marketable_drop_owner: "account"
  composition_bonus_axes:
    - class_role
    - pet_family
    - equipment_affinity
    - clan_buff
    - stone_attribute
  slot_unlocks:
    slot_1: start
    slot_2: first_boss_clear
    slot_3: cube_level_4
    slot_4: rune_or_mark_node
  anti_conflict_rules:
    - "No last-hit ownership."
    - "No duplicate character deployment by default."
    - "No multiplayer shared loot rolling in launch version."
    - "Formation bonus changes expected value but not item ownership."

random_option_policy:
  source_schema: "ResourceItem.options / optionCounts"
  steam_rule: "Market-critical options must be represented by immutable item definition data, item tags, or market_hash_name."
  avoid_for_market_value:
    - "hidden decimal dynamic_props"
    - "client-settable properties"
    - "post-trade-cleared properties"
  modes:
    sealed_roll:
      market_behavior: "Tradeable before reveal."
      game_behavior: "Reveal consumes Steam item and creates a server-bound rolled instance."
      best_for: [equipment, pet_egg, character_ticket]
    visible_bucket:
      market_behavior: "Tradeable with option family/tier visible in item name and tags."
      game_behavior: "Exact stat values are constrained to that bucket; equip/reroll may bind."
      best_for: [high_value_equipment, rare_pet, rare_character]
    bound_instance:
      market_behavior: "Not tradeable."
      game_behavior: "Full random values, enhance history, reroll history live in server DB."
      best_for: [equipped_gear, trained_pet, leveled_character]

launch_burn_targets:
  day_1:
    - "First stone evolution consumes 100+ low-tier fragments."
    - "Cube unlock consumes catalyst and ore, not only gold."
  week_1:
    - "Top rank attempts consume low-tier stacks, mid-tier ore, and boss cores."
    - "Clan mine donations burn materials for group buffs."
  season_1:
    - "Prestige inscriptions consume massive low-tier lots plus rare catalyst."
    - "Season cosmetic crafting burns old materials before new faucets arrive."
