review_gate:
  pass_conditions:
    - "Every section in the selected concept has semantic ownership."
    - "Window frame, slot grid, tab bar, portal map, and combat strip can be built from Godot Controls plus TextureAtoms."
    - "No text, numbers, cooldowns, or Korean labels are baked into reusable skins."
    - "A screenshot with workshop windows visible reads as desktop windows, and a minimized screenshot still leaves the taskbar combat strip understandable."
    - "The full overlay has no opaque background fill; empty regions expose the user's desktop through per-pixel transparency."
  blockers:
    - "Korean pixel font and icon atlas variants are still pending; title bar normal-state atoms are implemented procedurally in WindowTitleBarChrome."
    - "A modal or floating window visually behaves like a full-screen mobile menu instead of a desktop window."
    - "The taskbar combat strip cannot stand alone when the workshop window stack is minimized."
