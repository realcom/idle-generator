version: "1.0"
game: taskstonebar
status: draft
purpose: "Semantic component decomposition for the Taskstonebar full desktop overlay before Godot Control generation."

source_concepts:
  primary:
    id: main_ui_concept_e_refined_current_mockup_b
    note: concepts/main_ui_concept_e_refined_current_mockup_b.md
    image: concepts/main_ui_concept_e_refined_current_mockup_b.png
  supporting:
    - { id: stone_raising_2_full_ui_concept_a, note: concepts/stone_raising_2_full_ui_concept_a.md, image: concepts/stone_raising_2_full_ui_concept_a.png }
    - { id: status_window_concept_c_tbh_stat_skill_layout, note: concepts/status_window_concept_c_tbh_stat_skill_layout.md, image: concepts/status_window_concept_c_tbh_stat_skill_layout.png }
    - { id: combat_map_progress_badge_concept_a_b, note: concepts/combat_map_progress_badge_concept_a_b.md, image: concepts/combat_map_progress_badge_concept_b_candidate.png }
    - { id: window_title_bar_concept_c_forged_rail, note: concepts/window_title_bar_concept_c_forged_rail.md, image: concepts/window_title_bar_concept_c_forged_rail.png }

runtime_targets:
  godot_control:
    recipe: ../../godot/recipes/ui/taskstonebar-full-ui-overlay.yaml
    project: ../../runtime/godot-taskstonebar/project.godot
    owner_scene: ../../runtime/godot-taskstonebar/scenes/main.tscn
    owner_script: ../../runtime/godot-taskstonebar/scripts/main.gd

foundation_systems:
  inventory: ui-system-inventory.yaml
  buttons: button-system.yaml
  modals: modal-system.yaml
  colors: color-tokens.yaml
  spacing: layout-tokens.yaml
  skins: component-skins.yaml
  assets: asset-plan.yaml

extraction_rules:
  semantic_first:
    - "Preserve the three floating windows plus bottom combat strip as separate section ownership."
    - "All modal and workshop surfaces must read as desktop windows with native title chrome, close affordances, framed bodies, and focus depth."
    - "The bottom combat strip is the persistent product surface: it must remain readable in taskbar_mode when the workshop window stack is minimized."
    - "Text, counters, stage labels, cooldowns, and Korean labels remain Godot native controls."
    - "Generated concept art is a guide; never use the full concept PNG as the implementation surface."
    - "Non-stretch-safe crests, chains, and corner ornaments stay as fixed runtime atoms; the current Godot title chrome rebuilds them as native Control details instead of a baked image."
  sizing_language:
    slice_hints: "Bitmap cap borders for Godot NinePatchRect or StyleBoxTexture."
    content_insets: "Inner safe area for native labels, icons, counters, and hit targets."
    gap: "Stable spacing between slots and repeated chips."

surfaces:
  TaskstonebarFullUiOverlay:
    intent: "Full 1586x992 desktop overlay matching the selected 돌키우기2 mockup: top resources, three RPG windows, bottom combat strip, and OS taskbar-safe band."
    orientation: landscape_desktop_overlay
    reference_size_px: { width: 1586, height: 992 }
    source_concepts:
      primary: main_ui_concept_e_refined_current_mockup_b
    sections:
      desktop_scaffold:
        role: "Owns transparent desktop overlay holes, top resource readouts, utility commands, Steam status, and OS taskbar-safe band."
        process_scope: section
        components: [DesktopOverlayRoot, TopResourceBar, ResourceCounter, UtilityIconCluster, SteamSyncStatus]
        layout_contract:
          anchor: full_rect
          top_resource_bar_px: { x: 402, y: 15, width: 744, height: 42 }
          utility_icon_cluster_px: { x: 1020, y: 16, width: 128, height: 40 }
          os_taskbar_safe_band_px: { x: 0, y: 940, width: 1586, height: 52 }
        asset_keys:
          - taskstonebar.ui.resource_chip_9slice
          - taskstonebar.ui.resource_icon_set
          - taskstonebar.ui.native_overlay_controls
        qa_focus:
          - "Top resource labels must not overflow the chip frames."
          - "Empty space between windows is transparent so the user's real desktop remains visible."
          - "OS taskbar motif remains visually separated from gameplay controls."
          - "taskbar_mode keeps only the always-on combat/status band visible, with workshop windows collapsed out of the primary view."

      window_stack:
        role: "Owns the status, stone keeper inventory, and portal windows as draggable/minimizable desktop-style panels."
        process_scope: section
        components:
          - WindowFrame
          - WindowTitleBar
          - StatusWindow
          - StatusStatScrollPanel
          - StatList
          - StatusSearchButton
          - SkillPointHeader
          - SkillLevelTrack
          - SkillTierRow
          - SkillIconSlot
          - HeroInventoryWindow
          - CharacterPortrait
          - EquipmentSlotGrid
          - StoneEquipmentTabBar
          - StoneInventoryPanel
          - Slot
          - KeeperIconDock
          - PortalWindow
          - PortalDifficultySelect
          - ActTabBar
          - ParchmentRouteMap
          - StageNode
        layout_contract:
          status_window_px: { x: 225, y: 72, width: 438, height: 560, visual_scale: 0.8, visual_width: 350, visual_height: 448 }
          hero_inventory_window_px: { x: 591, y: 48, width: 504, height: 624, visual_scale: 0.8, visual_width: 403, visual_height: 499 }
          portal_window_px: { x: 1010, y: 72, width: 438, height: 560, visual_scale: 0.8, visual_width: 350, visual_height: 448 }
          window_gap_px: 16
          compact_chrome_px: { title_height: 42, title_inset: 10, client_top: 56 }
          z_order: "StatusWindow, HeroInventoryWindow, and PortalWindow sit as a tight 0.8x visual-scale workshop cluster above combat strip; hero inventory is focused by default."
        asset_keys:
          - taskstonebar.ui.window_frame_9slice
          - taskstonebar.ui.window_title_bar_9slice
          - taskstonebar.ui.dark_inner_well_9slice
          - taskstonebar.ui.slot_frame_9slice
          - taskstonebar.ui.skill_tree_icon_set
          - taskstonebar.ui.tab_burgundy_9slice
          - taskstonebar.ui.icon_dock_button_9slice
          - taskstonebar.ui.keeper_dock_icon_set
          - taskstonebar.ui.close_icon
          - taskstonebar.ui.stone_icon_set
          - taskstonebar.ui.stone_keeper_sheet
          - taskstonebar.ui.portal_parchment_map
        qa_focus:
          - "StoneInventoryPanel keeps 8 columns x 4 rows so the 32 visible cells fill the center inventory body."
          - "The three workshop windows keep the compact reference feel: short title chrome, 16px inter-window gap, and no window extending into the combat strip."
          - "Portal reward cards stay out of the portal map body."
          - "Window title text remains native Korean Label."
          - "Each window has clear title chrome, close behavior, focus depth, and a body well; hiding a window never stops combat."

      bottom_combat_strip:
        role: "Always-on taskbar combat lane that remains visible when the workshop window stack is minimized, with stone keeper projectiles, enemies, HP feedback, damage numbers, stage badge, and rare drop toast."
        process_scope: section
        components: [TaskbarCombatStrip, HeroCombatSprite, EnemyStack, EnemyHpBar, DamageNumberLayer, ProjectileLayer, AutoCombatToggle, AutoSkillToggle, StageBadge, LootTicker, RareDropToast, CombatMapProgressBadge, CombatSceneShortcutDock]
        layout_contract:
          anchor: bottom_above_os_taskbar
          bounds_px: { x: 0, y: 704, width: 1586, height: 236 }
          stage_badge_px: { x: 710, y: 846, width: 166, height: 58 }
          rare_drop_toast_px: { x: 1276, y: 764, width: 220, height: 70 }
          map_progress_badge_px: { x: 1008, y: 822, width: 264, height: 106 }
        asset_keys:
          - taskstonebar.ui.combat_ground_strip
          - taskstonebar.ui.stone_keeper_sheet
          - taskstonebar.ui.stone_icon_set
          - taskstonebar.ui.resource_icon_set
          - taskstonebar.ui.rare_drop_toast_9slice
          - taskstonebar.ui.combat_map_progress_badge_concept_b
          - taskstonebar.ui.combat_map_progress_portal_atom
          - taskstonebar.ui.combat_map_progress_route_silhouette
          - taskstonebar.ui.combat_map_progress_next_marker
          - taskstonebar.ui.native_overlay_controls
        qa_focus:
          - "Combat readability wins over decorative frame weight."
          - "Damage number, stage name, and drop text are native controls."
          - "The strip must work as a standalone glanceable taskbar companion: current stage, enemy HP, latest hit, and latest drop are understandable without any modal open."

      modal_host:
        role: "Owns desktop-window modals above workshop windows while preserving the bottom combat strip as readable taskbar context."
        process_scope: section
        components:
          - ModalHost
          - ModalShell
          - ItemDetailModal
          - ItemDetailIdentityPanel
          - ItemDetailStatList
          - ItemDetailWarningChipRow
          - ItemDetailActionFooter
          - EquipmentUpgradeModal
          - EquipmentUpgradeSourceTray
          - EquipmentUpgradeResultPreview
          - EquipmentUpgradeActionFooter
          - Slot
        layout_contract:
          anchor: full_rect_overlay
          scrim_bounds_px: { x: 0, y: 0, width: 1586, height: 704 }
          shell_px: { x: 556, y: 168, width: 474, height: 372 }
          preserve_combat_strip: true
          z_order: "Above window_stack and below toast layer; scrim stops before bottom_combat_strip."
        asset_keys:
          - taskstonebar.ui.window_frame_9slice
          - taskstonebar.ui.window_title_bar_9slice
          - taskstonebar.ui.dark_inner_well_9slice
          - taskstonebar.ui.slot_frame_9slice
          - taskstonebar.ui.close_icon
          - taskstonebar.ui.native_overlay_controls
        qa_focus:
          - "EquipmentUpgradeModal reads as a small desktop program window with title chrome, close affordance, framed body, and footer buttons."
          - "ItemDetailModal reads as an inspect-first item page: large slot preview, item identity, stat/source list, warning chips, and footer actions."
          - "Consumed equipment slots and result preview are separate native slot controls; labels/counts are not baked into skin art."
          - "The modal scrim leaves TaskbarCombatStrip visible and combat feedback readable."
    component_tree:
      - DesktopOverlayRoot
      - TopResourceBar
      - ResourceCounter
      - UtilityIconCluster
      - SteamSyncStatus
      - WindowFrame
      - WindowTitleBar
      - StatusWindow
      - StatusStatScrollPanel
      - StatList
      - StatusSearchButton
      - SkillPointHeader
      - SkillLevelTrack
      - SkillTierRow
      - SkillIconSlot
      - HeroInventoryWindow
      - CharacterPortrait
      - EquipmentSlotGrid
      - StoneEquipmentTabBar
      - StoneInventoryPanel
      - Slot
      - KeeperIconDock
      - PortalWindow
      - PortalDifficultySelect
      - ActTabBar
      - ParchmentRouteMap
      - StageNode
      - TaskbarCombatStrip
      - HeroCombatSprite
      - EnemyStack
      - EnemyHpBar
      - DamageNumberLayer
      - ProjectileLayer
      - AutoCombatToggle
      - AutoSkillToggle
      - StageBadge
      - LootTicker
      - RareDropToast
      - CombatMapProgressBadge
      - CombatSceneShortcutDock
      - ModalHost
      - ModalShell
      - ItemDetailModal
      - ItemDetailIdentityPanel
      - ItemDetailStatList
      - ItemDetailWarningChipRow
      - ItemDetailActionFooter
      - EquipmentUpgradeModal
      - EquipmentUpgradeSourceTray
      - EquipmentUpgradeResultPreview
      - EquipmentUpgradeActionFooter
    layout_contract:
      shell_width: "min(1586px, 100vw)"
      responsive_policy: "At widths below 1366px, keep center window and combat strip first, then allow side windows to compact/collapse."

components:
  DesktopOverlayRoot:
    role: "Root Control for the transparent desktop overlay, window stack, combat strip, modal host, and OS taskbar-safe band."
    mode: native_ui
    anatomy: [transparent_desktop_holes, resource_layer, utility_layer, window_stack, combat_strip, os_taskbar_band, modal_host]
    data_bindings: { runtime_mode: runtime.mode, server_mode: server.mode, focus_window: ui.focus_window, window_stack_collapsed: ui.window_stack_collapsed }
    box_model:
      min_width_px: 960
      min_height_px: 540
      content_insets_px: { left: 0, right: 0, top: 0, bottom: 52 }
      padding_px: 0
      gap_px: 0
      text_clamp: none
      touch_target_px: 40

  TopResourceBar:
    role: "Top-center resource counter row."
    mode: native_ui
    anatomy: [resource_counter_gold, resource_counter_ruby, resource_counter_fragment, resource_counter_ore, resource_counter_cube]
    data_bindings: { counters: inventory.resource_counts, stale_state: steam_inventory_sync_state }
    box_model:
      min_width_px: 744
      min_height_px: 42
      content_insets_px: { left: 0, right: 0, top: 0, bottom: 0 }
      padding_px: 0
      gap_px: 8
      text_clamp: single_line_ellipsis
      touch_target_px: 40

  ResourceCounter:
    role: "Single compact resource chip with icon, value, optional cap/stale badge, and gain animation."
    mode: hybrid
    repeatable: true
    anatomy: [skin, icon, value_label, delta_label, stale_badge]
    data_bindings: { icon_key: item.icon, value: item.count, delta: item.delta, stale: item.stale }
    box_model:
      min_width_px: 132
      min_height_px: 38
      content_insets_px: { left: 10, right: 10, top: 7, bottom: 7 }
      padding_px: 0
      gap_px: 8
      text_clamp: single_line_ellipsis
      touch_target_px: 40
    skin_contract:
      asset_key: taskstonebar.ui.resource_chip_9slice
      usage: godot_stylebox_texture
      slice_hints_px: { left: 16, right: 16, top: 14, bottom: 14 }
      content_insets_px: { left: 10, right: 10, top: 7, bottom: 7 }
    foundation_refs:
      button_role: resource_chip
      color_tokens: [panel_inner, title_gold]

  UtilityIconCluster:
    role: "Small top command buttons for settings, menu, and sync."
    mode: hybrid
    anatomy: [button_hit_areas, icon_atoms, alert_badges]
    data_bindings: { actions: ui.utility_actions, sync_state: steam_inventory_sync_state }
    box_model:
      min_width_px: 128
      min_height_px: 40
      content_insets_px: { left: 0, right: 0, top: 0, bottom: 0 }
      padding_px: 0
      gap_px: 8
      text_clamp: none
      touch_target_px: 40
    skin_contract:
      asset_key: taskstonebar.ui.icon_dock_button_9slice
      usage: godot_stylebox_texture
      slice_hints_px: { left: 18, right: 18, top: 18, bottom: 18 }
      content_insets_px: { left: 6, right: 6, top: 6, bottom: 6 }
    foundation_refs:
      button_role: utility_icon
      color_tokens: [panel_outer, title_gold]

  SteamSyncStatus:
    role: "Bottom OS taskbar status text for live server and Steam sync."
    mode: native_ui
    anatomy: [server_badge_label, steam_sync_label, time_label]
    data_bindings: { server_state: server.live_state, sync_state: steam_inventory_sync_state, local_time: ui.clock }
    box_model:
      min_width_px: 320
      min_height_px: 32
      content_insets_px: { left: 8, right: 8, top: 4, bottom: 4 }
      padding_px: 0
      gap_px: 10
      text_clamp: single_line_ellipsis
      touch_target_px: 40

  ModalHost:
    role: "Root modal layer for desktop-window overlays; owns scrim and shell placement without covering the persistent combat strip."
    mode: native_ui
    anatomy: [scrim_layer, modal_shell_slot, toast_passthrough, combat_strip_passthrough]
    data_bindings: { active_modal: ui.active_modal, modal_route: runtime.modal_route, combat_strip_visible: ui.combat_strip_visible }
    box_model:
      min_width_px: 960
      min_height_px: 540
      content_insets_px: { left: 0, right: 0, top: 0, bottom: 236 }
      padding_px: 0
      gap_px: 0
      text_clamp: none
      touch_target_px: 40

  ModalShell:
    role: "Reusable desktop-style modal shell with separate scrim, frame, header, body, and footer regions."
    mode: hybrid
    anatomy: [scrim, frame_skin, title_bar, title_label, close_button, body_well, footer_actions]
    data_bindings: { title_text: modal.title_key, focused: ui.focus_modal, close_policy: modal.close_policy }
    box_model:
      min_width_px: 438
      min_height_px: 320
      content_insets_px: { left: 28, right: 28, top: 68, bottom: 22 }
      padding_px: 0
      gap_px: 12
      text_clamp: single_line_ellipsis
      touch_target_px: 42
    skin_contract:
      asset_key: taskstonebar.ui.window_frame_9slice
      usage: godot_nine_patch_rect
      slice_hints_px: { left: 30, right: 30, top: 34, bottom: 30 }
      content_insets_px: { left: 28, right: 28, top: 68, bottom: 22 }
    foundation_refs:
      modal_system: modal-system.yaml
      button_role: window_close
      color_tokens: [panel_outer, panel_mid, panel_inner, title_gold]

  ItemDetailModal:
    role: "Inspect-first desktop item page for stones and equipment opened from inventory slots."
    mode: hybrid
    anatomy: [modal_shell, title_chrome, identity_panel, stat_list, warning_chip_row, action_footer]
    data_bindings: { item_instance: inventory.selected_item, item_kind: inventory.selected_kind, valid_actions: inventory.selected_item.actions }
    box_model:
      min_width_px: 490
      min_height_px: 430
      content_insets_px: { left: 28, right: 28, top: 68, bottom: 22 }
      padding_px: 0
      gap_px: 12
      text_clamp: single_line_or_five_stat_rows
      touch_target_px: 42
    skin_contract:
      asset_key: taskstonebar.ui.dark_inner_well_9slice
      usage: godot_nine_patch_rect
      slice_hints_px: { left: 22, right: 22, top: 22, bottom: 22 }
      content_insets_px: { left: 16, right: 16, top: 14, bottom: 12 }
    foundation_refs:
      source_concept: concepts/item_detail_modal_concept_a.md
      modal_section: DetailedItemModal
      button_roles: [window_close, inventory_tab, utility_icon]
      color_tokens: [panel_inner, text_cream, text_muted, title_gold, moss_green]

  ItemDetailIdentityPanel:
    role: "Top item identity region with a large slot preview, item name, category/grade line, and safe-use hint."
    mode: hybrid
    anatomy: [preview_slot, item_name_label, item_subtitle_label, safe_use_hint]
    data_bindings: { icon: item.icon, name: item.name, subtitle: item.category_grade_level, hint: item.safe_use_hint }
    box_model:
      min_width_px: 402
      min_height_px: 112
      content_insets_px: { left: 16, right: 16, top: 16, bottom: 10 }
      padding_px: 0
      gap_px: 16
      text_clamp: single_line_ellipsis
      touch_target_px: 44
    skin_contract:
      asset_key: taskstonebar.ui.slot_frame_9slice
      usage: godot_nine_patch_rect
      slice_hints_px: { left: 18, right: 18, top: 18, bottom: 18 }
      content_insets_px: { left: 6, right: 6, top: 6, bottom: 6 }

  ItemDetailStatList:
    role: "Readable native stat/source/sink list for the selected item."
    mode: native_ui
    anatomy: [list_back, stat_rows, source_rows]
    data_bindings: { detail_lines: item.detail_lines, max_rows: 5 }
    box_model:
      min_width_px: 402
      min_height_px: 92
      content_insets_px: { left: 14, right: 14, top: 6, bottom: 6 }
      padding_px: 0
      gap_px: 5
      text_clamp: five_rows
      touch_target_px: 40
    foundation_refs:
      color_tokens: [panel_inner, text_cream, text_muted, moss_green]

  ItemDetailWarningChipRow:
    role: "Compact ownership and irreversible-action warning chips."
    mode: native_ui
    anatomy: [ownership_chip, warning_chip]
    data_bindings: { ownership: item.ownership_summary, warning: item.action_warning }
    box_model:
      min_width_px: 402
      min_height_px: 28
      content_insets_px: { left: 8, right: 8, top: 4, bottom: 4 }
      padding_px: 0
      gap_px: 10
      text_clamp: single_line_ellipsis
      touch_target_px: 40

  ItemDetailActionFooter:
    role: "Footer action row for close plus item-type-specific actions."
    mode: native_ui
    anatomy: [close_button, equip_button, merge_or_upgrade_button]
    data_bindings: { actions: item.valid_actions, disabled_reasons: item.disabled_reasons }
    box_model:
      min_width_px: 406
      min_height_px: 46
      content_insets_px: { left: 0, right: 0, top: 0, bottom: 0 }
      padding_px: 0
      gap_px: 10
      text_clamp: single_line_ellipsis
      touch_target_px: 42
    foundation_refs:
      button_roles: [utility_icon, inventory_tab]
      color_tokens: [panel_mid, title_gold, text_cream]

  EquipmentUpgradeModal:
    role: "Desktop-window synthesis modal for consuming exactly three matching equipment instances and previewing one higher-tier result."
    mode: hybrid
    anatomy: [modal_shell, title_chrome, consumed_source_tray, upgrade_arrow, result_preview, irreversible_warning, action_footer]
    data_bindings: { source_items: equipment.upgrade.sources, result_item: equipment.upgrade.result, can_confirm: equipment.upgrade.can_confirm, warning: equipment.upgrade.warning }
    box_model:
      min_width_px: 438
      min_height_px: 344
      content_insets_px: { left: 28, right: 28, top: 68, bottom: 22 }
      padding_px: 0
      gap_px: 12
      text_clamp: two_line_clamp
      touch_target_px: 42
    skin_contract:
      asset_key: taskstonebar.ui.dark_inner_well_9slice
      usage: godot_nine_patch_rect
      slice_hints_px: { left: 22, right: 22, top: 22, bottom: 22 }
      content_insets_px: { left: 16, right: 16, top: 14, bottom: 12 }
    foundation_refs:
      modal_section: ConsumeConfirmModal
      button_roles: [window_close, inventory_tab, utility_icon]
      color_tokens: [panel_inner, text_cream, text_muted, title_gold]

  EquipmentUpgradeSourceTray:
    role: "Three fixed consumed-equipment slots inside EquipmentUpgradeModal."
    mode: hybrid
    repeatable: false
    anatomy: [source_slot_1, source_slot_2, source_slot_3, consumed_count_label]
    data_bindings: { source_items: equipment.upgrade.sources, consumed_count: equipment.upgrade.consumed_count }
    box_model:
      min_width_px: 178
      min_height_px: 68
      content_insets_px: { left: 0, right: 0, top: 0, bottom: 0 }
      padding_px: 0
      gap_px: 6
      text_clamp: single_line_ellipsis
      touch_target_px: 44
    skin_contract:
      asset_key: taskstonebar.ui.slot_frame_9slice
      usage: godot_nine_patch_rect
      slice_hints_px: { left: 18, right: 18, top: 18, bottom: 18 }
      content_insets_px: { left: 6, right: 6, top: 6, bottom: 6 }

  EquipmentUpgradeResultPreview:
    role: "Single higher-tier result slot with runtime-native name, badge, and tier label."
    mode: hybrid
    anatomy: [result_slot, result_name_label, tier_badge]
    data_bindings: { result_item: equipment.upgrade.result, result_tier: equipment.upgrade.result_tier }
    box_model:
      min_width_px: 68
      min_height_px: 68
      content_insets_px: { left: 0, right: 0, top: 0, bottom: 0 }
      padding_px: 0
      gap_px: 6
      text_clamp: single_line_ellipsis
      touch_target_px: 44
    skin_contract:
      asset_key: taskstonebar.ui.slot_frame_9slice
      usage: godot_nine_patch_rect
      slice_hints_px: { left: 18, right: 18, top: 18, bottom: 18 }
      content_insets_px: { left: 6, right: 6, top: 6, bottom: 6 }

  EquipmentUpgradeActionFooter:
    role: "Footer action row for cancel and confirm, with confirm disabled until three valid matching equipment instances exist."
    mode: native_ui
    anatomy: [secondary_cancel_button, primary_confirm_button, disabled_reason]
    data_bindings: { confirm_enabled: equipment.upgrade.can_confirm, disabled_reason: equipment.upgrade.disabled_reason }
    box_model:
      min_width_px: 292
      min_height_px: 46
      content_insets_px: { left: 0, right: 0, top: 0, bottom: 0 }
      padding_px: 0
      gap_px: 12
      text_clamp: single_line_ellipsis
      touch_target_px: 42
    foundation_refs:
      button_roles: [utility_icon, inventory_tab]
      color_tokens: [panel_mid, title_gold, text_cream]

  WindowFrame:
    role: "Reusable floating RPG desktop window shell with title bar, close control, body well, and focus depth."
    mode: hybrid
    repeatable: true
    anatomy: [outer_frame_skin, title_bar, title_label, body_host, close_button, focus_shadow]
    data_bindings: { title_text: window.title_key, focused: ui.focus_window, collapsed: window.collapsed }
    box_model:
      min_width_px: 420
      min_height_px: 520
      content_insets_px: { left: 14, right: 14, top: 56, bottom: 14 }
      padding_px: 0
      gap_px: 0
      text_clamp: single_line_ellipsis
      touch_target_px: 42
    skin_contract:
      asset_key: taskstonebar.ui.window_frame_9slice
