art_anchor:
  theme: "desktop taskbar pixel idle RPG"
  identity:
    hero: "tiny pixel adventurer throwing rocks from the left edge of a transparent taskbar strip"
    growth_object: "stone evolution line: pebble -> angled stone -> ancient taskstone"
    ui: "brown 9-slice RPG panels with warm gold titles and dark inner wells"
  must_keep:
    - "transparent lower combat strip that can sit above a desktop/taskbar"
    - "32px pixel stones and currency icons scaled with crisp nearest-neighbor rendering"
    - "rounded but low-radius brown frames, gold text, black drop shadows"
    - "merge-board slot language for stone growth"
    - "online-only premium drops: chests, cube catalyst, higher ore"
  must_avoid:
    - "directly copying TBH class/equipment naming; this is a stone/cube variant"
    - "large mobile hero-page composition"
    - "smooth vector-only UI that loses the pixel toy feel"
    - "overly dark unreadable panels"

