version: "1.0"
game: ninja2
source_concepts:
  - ninja2_rulelocked_housing_home_a
  - ninja2_rulelocked_survival_battle_a
  - ninja2_survival_visual_runtime_polish_f
  - ninja2_sanctuary_build_modal_a
  - ninja2_home_cash_shop_modal_b
  - ninja2_run_result_clear_concept_a
  - ninja2_run_result_defeat_concept_a
status: extracted

assetization_summary:
  generate_image:
    - "home forest sanctuary background with transparent-safe board clearing"
    - "Lantern Shrine and production building sprite atlas"
    - "sanctuary extension building atlas for quarry, workshop, scout post, and midgame production"
    - "SD guardian portrait and board resident sprite set"
    - "parchment panel plus resource board/chip 9-slice skins"
    - "orange sortie button fixed sprite"
    - "run result victory/defeat status slab 9-slice skins"
    - "run result victory/defeat crest icons"
    - "run result reward section brush title background"
    - "run result battle aftermath backdrop"
    - "run result generic orange return CTA 9-slice skin"
    - "battle forest prop sprite set for survival map decoration"
    - "battle enemy and pickup atlas"
    - "4-way guardian walk sheet for Godot/Phaser runtime-polish movement QA"
    - "resource collection dungeon icon set for exploration list/detail rows"
  native_ui:
    - "top resource chip layout and text"
    - "hex grid coordinates and tile state overlays"
    - "progress bars, timers, labels, nav tabs"
  hybrid:
    - "building cards use generated sprite plus native labels/progress"
    - "sortie button uses generated skin plus native text"
    - "battle skill buttons use native circles plus generated icons"
    - "battle skill VFX use Phaser-native graphics/tweens first, then graduate selected effects to bitmap atlases later"
    - "Godot battle action dock uses native circles/rings plus generated dash and skill icon atoms"
    - "Godot/Phaser movement uses generated walk sheets plus runtime camera follow, foot shadow, and dash afterimage"
    - "run result modal uses generated status/button skins and crest sprites, while title, stats, reward rows, and reward quantities stay runtime-native"
    - "run result backdrop reuses generated forest/battle sprites as a composed background asset while the modal remains separate UI"
  reuse:
    - "source concept images remain visual references only"
    - "run result outer modal shell reuses ninja2.ui.panel.parchment_9slice"

