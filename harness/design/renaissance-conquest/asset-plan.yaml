version: "1.0"
game: renaissance-conquest
source_concepts:
  - strategy-shell-godot-v0
status: draft

assetization_summary:
  native_ui:
    - "Godot-native panels, labels, buttons, city buttons, stat rows, and battle slots."
  generate_image:
    - "campaign map art used as the main visual image under native controls"
    - "city inspector preview image"
    - "officer portrait strip cropped in Godot with AtlasTexture"
    - "battlefield background art used under native 2x3 formation slots"
    - "battle skill icon strip cropped in Godot with AtlasTexture"
    - "battle unit type icon strip cropped in Godot for formation token thumbnails"
    - "battle unit ground squad transparent strip cropped in Godot for battlefield standees"
    - "command rail icon strip cropped in Godot with AtlasTexture"
    - "top HUD resource icon strip cropped in Godot with AtlasTexture"
    - "top-right action icon strip cropped in Godot with AtlasTexture"
    - "city inspector stat/development icon strip cropped in Godot with AtlasTexture"
    - "faction crest strip cropped in Godot with AtlasTexture"
    - "campaign minimap art"
    - "panel/button/card/chip skin atlas consumed by Godot StyleBoxTexture"
    - "command button frame atlas plus fixed circular medallion icon atlas for the left command rail"

assets:
  - key: renaissance.ui.native_strategy_shell
    type: native_control_surface
    mode: native_ui
    platforms: [godot]
    godot:
      usage: native_control_surface
      target_path: harness/runtime/godot-renaissance-conquest/scenes/main.tscn
    usage:
      - component-blueprints.yaml:StrategyShellRoot
      - godot recipe:renaissance-conquest-strategy-shell
    status: draft
    priority: must
    notes: "No bitmap asset required for v0; validates native Godot-first UI ownership."

  - key: renaissance.map.italy_vector_v0
    type: procedural_vector_map
    mode: native_ui
    platforms: [godot]
    godot:
      usage: scripted_draw
