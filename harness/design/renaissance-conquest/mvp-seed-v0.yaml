    name: "House Stella Cadente"
    ideology: republican_patron
    capital: city_florence
    fantasy: "A minor house transformed by an impossible foreign advisor."
    starting_resources:
      ap: 3
      ducats: 3200
      grain: 900
      prestige: 8
      faith: 4
      intel: 2
      tech: 1
      favor: 0
    initial_relations:
      faction_medici_court: -10
      faction_papal_envoys: 0
      faction_condottieri_league: 5

  - id: faction_medici_court
    name: "Medici Court"
    ideology: merchant
    capital: city_florence
    fantasy: "Bankers, patrons, and quiet kingmakers trying to own the city without wearing a crown."
    initial_relations:
      faction_player_house: -10
      faction_papal_envoys: 15
      faction_condottieri_league: 20

  - id: faction_papal_envoys
    name: "Papal Envoys"
    ideology: papal
    capital: city_siena
    fantasy: "A roaming church-political machine that grants legitimacy and collects obedience."
    initial_relations:
      faction_player_house: 0
      faction_medici_court: 15
      faction_condottieri_league: -5

  - id: faction_condottieri_league
