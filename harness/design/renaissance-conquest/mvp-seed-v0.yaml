meta:
  game_id: renaissance-conquest
  version: v0
  date: "2026-06-21"
  status: design_seed
  source_contract: system-contracts-v0.yaml
  note: >
    This is not approved runtime content yet. It is the first seed set for
    protagonist, opening cities, factions, troop classes, and S-grade officers.

decisions_snapshot:
  player_identity: fixed_isekai_protagonist
  history_policy: alternate_history_variants
  content_rating: mature_non_explicit
  runtime_strategy: godot_first_harness_validated

protagonist:
  id: protagonist
  default_name: Yujin Han
  player_name_customizable: true
  origin_world: "Modern Korea, near-future."
  role: hybrid_patron_commander
  can_enter_battle: prototype_toggle
  social_mask: "A foreign scholar and accountant taken in by a minor Florentine household."
  premise: >
    A modern systems-minded protagonist wakes beneath the unfinished dome of
    an alternate Florence with a ledger, a half-broken phone, and no legal identity.
  limitation: >
    The protagonist understands systems, maps, and future concepts, but lacks
    noble blood, local language mastery, military legitimacy, and reliable technology.
  personal_goal: >
    Survive long enough to discover why this Renaissance is diverging from history,
    then decide whether to return home or build a new order.
  gameplay_hooks:
    council_lens:
      effect: "Adds special interpretation choices in political and officer events."
    outsider_ledger:
      effect: "+1 AP after building Council Hall level 2; prototype balance only."
    future_fragments:
      effect: "Unlocks rare Tech/Patronage choices when paired with engineers or scholars."
    relationship_anchor:
      effect: "S-grade officer chains use protagonist bond as a core progress stat."

opening_state:
  year: "1494 alternate"
  season: spring
  starting_city: city_florence
  starting_faction: faction_player_house
  opening_pressure:
    - "Florence is rich but politically unstable."
    - "The Medici variant faction wants the protagonist controlled, not empowered."
    - "Papal envoys treat the protagonist as either miracle, heresy, or asset."
    - "Condottieri companies are preparing to sell protection to the highest bidder."
  first_turn_goals:
    - "Secure a legal patron before the city council expels the protagonist."
    - "Choose one officer to assign to commerce, engineering, or intrigue."
    - "Scout Pisa or Siena before committing to a first campaign battle."

factions:
