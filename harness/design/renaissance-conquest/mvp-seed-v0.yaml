    combat_stats: { atk: 4, def: 4, int: 8, spd: 6, command: 7 }
    civic_stats: { commerce: 9, diplomacy: 8, engineering: 3, intrigue: 6, culture: 9, faith: 5 }
    relationship_stats: { loyalty: 28, ambition: 72, fatigue: 0, reputation: 86, bond: 0 }
    contract: { type: patronage, duration_turns: null, salary: 220, renewal_condition: "keep_florence_wealth_gte_65" }
    personality:
      desire: family
      flaw: "Trusts ledgers more than vows."
      taboo: "public_humiliation"
    traits: [trait_banking_network, trait_patron_of_painters, trait_cold_reader]
    skills: [skill_crossbow_volley, skill_ledger_blackmail, skill_patronage_web]
