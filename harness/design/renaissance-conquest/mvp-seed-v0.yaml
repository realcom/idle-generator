storylet_seed_examples:
  - id: evt_florence_ledger_trial
    type: first_meeting
    participants: { primary: protagonist, secondary: [city_florence, cmd_lorenza_medici] }
    trigger:
      all:
        - { condition: turn_gte, value: 1 }
        - { condition: city_has_flag, city: city_florence, flag: flag_foreign_scholar_rumor }
      none:
        - { condition: route_flag_set, flag: flag_opening_ledger_trial_done }
    priority: 100
    premise: "Florentine guild auditors demand proof that the protagonist is not a fraud."
    choices:
      - id: choice_show_modern_accounting
        label: "Balance the books in public"
        effects:
          - { effect: add_resource, faction: faction_player_house, resource: prestige, value: 3 }
          - { effect: add_city_stat, city: city_florence, stat: guild_power, value: 2 }
          - { effect: set_route_flag, flag: flag_opening_ledger_trial_done }
      - id: choice_ask_lorenza_to_intervene
        label: "Let Lorenza make the room quiet"
        effects:
          - { effect: add_bond, commander: cmd_lorenza_medici, value: 5 }
          - { effect: add_relation, faction: faction_medici_court, value: 3 }
          - { effect: set_route_flag, flag: flag_opening_ledger_trial_done }

  - id: evt_cesare_05_betrayal_check
    type: betrayal
    participants: { primary: cmd_cesare_borsia, secondary: [protagonist, city_siena] }
    trigger:
      all:
        - { condition: commander_loyalty_lt, commander: cmd_cesare_borsia, value: 35 }
        - { condition: commander_ambition_gte, commander: cmd_cesare_borsia, value: 85 }
      none:
        - { condition: commander_has_flag, commander: cmd_cesare_borsia, flag: flag_cesare_clear }
    priority: 80
    premise: "Cesare receives an offer to abandon the protagonist in exchange for a city title."
    choices:
      - id: choice_pay_him
        label: "Pay him like a prince"
        effects:
          - { effect: add_resource, faction: faction_player_house, resource: ducats, value: -1200 }
          - { effect: add_loyalty, commander: cmd_cesare_borsia, value: 18 }
          - { effect: add_ambition, commander: cmd_cesare_borsia, value: 4 }
      - id: choice_offer_city_later
        label: "Promise him a future city"
        effects:
          - { effect: add_loyalty, commander: cmd_cesare_borsia, value: 10 }
          - { effect: set_commander_flag, commander: cmd_cesare_borsia, flag: flag_cesare_promised_city }
          - { effect: enqueue_event, event: evt_cesare_04_city_promised }
      - id: choice_refuse
        label: "Refuse to buy loyalty"
        effects:
          - { effect: add_loyalty, commander: cmd_cesare_borsia, value: -15 }
          - { effect: add_battle_modifier, modifier: mod_cesare_unreliable_next_battle }

  - id: evt_leonardo_01_broken_phone
    type: personal_chain
    participants: { primary: cmd_leonardo_vinca, secondary: [protagonist] }
    trigger:
      all:
        - { condition: commander_assigned_to_facility, commander: cmd_leonardo_vinca, facility: facility_workshop }
        - { condition: route_flag_missing, flag: flag_leonardo_saw_phone }
    priority: 70
    premise: "Leonardo sees the protagonist's dead phone and realizes it is not a relic, but a machine."
    choices:
      - id: choice_let_him_study_it
        label: "Let him disassemble the impossible glass"
        effects:
          - { effect: add_bond, commander: cmd_leonardo_vinca, value: 8 }
          - { effect: add_resource, faction: faction_player_house, resource: tech, value: 2 }
          - { effect: set_route_flag, flag: flag_leonardo_saw_phone }
      - id: choice_keep_secret
        label: "Keep it hidden for now"
        effects:
          - { effect: add_bond, commander: cmd_leonardo_vinca, value: -3 }
          - { effect: add_resource, faction: faction_player_house, resource: intel, value: 1 }
          - { effect: set_route_flag, flag: flag_phone_kept_secret }

open_design_questions:
  - "Should the protagonist be a deployable battle commander in the default mode?"
  - "Should battles be direct command, auto-resolve with tactical setup, or hybrid?"
  - "How dark should execution, hostage, and assassination outcomes become?"
  - "How close can a variant historical name stay before it feels like strict history simulation?"
