    resolution: { base_difficulty: 9, roll: 1d6 }
    outcomes:
      failure:
        - { effect: add_resource, resource: grain, value: -80 }
      partial:
        - { effect: add_battle_modifier, modifier: mod_siege_prep_minor }
      success:
        - { effect: add_battle_modifier, modifier: mod_siege_prep_standard }
      critical:
        - { effect: add_battle_modifier, modifier: mod_siege_prep_major }
