meta:
  game_id: renaissance-conquest
  version: v0
  date: "2026-06-21"
  status: design_contract
  purpose: "Data contract for MVP city commands, battle actions, battle phases, and aftermath hooks."

priority:
  order:
    - city_commands
    - battle_loop
    - aftermath
    - storylets
    - personal_chains
  reason: "VN events need concrete command and battle outcomes to react to."

turn_structure:
  default_ap: 3
  phases:
    - id: turn_start
      outputs: [income, salary_paid, recovery_tick, alert_queue]
    - id: command_phase
      outputs: [resource_changes, city_stat_changes, battle_modifiers, event_candidates]
    - id: battle_phase
      outputs: [battle_result, routed_units, wall_damage, capture_candidates]
    - id: aftermath
      outputs: [prisoners, wounds, loot, prestige_changes, event_candidates]
    - id: event_queue
      outputs: [storylets_to_show, flags]
    - id: turn_end
      outputs: [project_progress, contract_duration_tick, fatigue_tick]

city_command_schema:
  required:
    - id
    - name
    - category
    - ap_cost
    - actor
    - target
    - resolution
    - outcomes
    - hooks
  fields:
    id: "string, unique"
    name: "display name"
    category: "develop | military | diplomacy | intrigue | patronage | order | recovery"
    ap_cost: "integer"
    actor:
      required: "boolean"
      slot: "assigned commander slot or any available commander"
      primary_stat: "civic stat key"
      secondary_stat: "optional supporting stat key"
      fatigue_gain: "integer"
    target:
      type: "own_city | enemy_city | faction | prisoner | commander | facility"
      required_state: "optional conditions"
    costs:
      ducats: "integer or expression"
      grain: "integer or expression"
      prestige: "integer or expression"
      faith: "integer or expression"
      intel: "integer or expression"
      tech: "integer or expression"
    resolution:
      base_difficulty: "integer"
      roll: "1d6"
      formula: "actor stat + modifiers + roll - difficulty"
      preview_bands:
        low: "expected margin <= -1"
        fair: "expected margin 0..2"
        good: "expected margin 3..5"
        strong: "expected margin >= 6"
    outcomes:
      failure: "effects when margin <= -5"
      partial: "effects when margin -4..0"
      success: "effects when margin 1..5"
      critical: "effects when margin >= 6"
    hooks:
      event_candidates: "storylet ids or event tags"
      battle_modifiers: "temporary modifier ids"
      flags: "flags set/cleared by result"

city_commands:
  - id: cmd_audit_ledgers
    name: Audit Ledgers
    category: develop
    ap_cost: 1
    actor: { required: true, slot: commerce, primary_stat: commerce, secondary_stat: intrigue, fatigue_gain: 4 }
    target: { type: own_city }
    costs: {}
    resolution: { base_difficulty: 8, roll: 1d6 }
    outcomes:
      failure:
        - { effect: add_city_stat, stat: unrest, value: 4 }
        - { effect: enqueue_event, tag: corruption_backlash }
      partial:
        - { effect: add_resource, resource: ducats, value: 350 }
      success:
        - { effect: add_resource, resource: ducats, value: 700 }
        - { effect: add_city_stat, stat: guild_power, value: 1 }
      critical:
        - { effect: add_resource, resource: ducats, value: 1100 }
        - { effect: add_resource, resource: intel, value: 1 }
        - { effect: enqueue_event, tag: ledger_secret }
    hooks: { event_candidates: [evt_florence_ledger_trial], battle_modifiers: [], flags: [] }

  - id: cmd_develop_district
    name: Develop District
    category: develop
    ap_cost: 1
    actor: { required: true, slot: engineering, primary_stat: engineering, secondary_stat: commerce, fatigue_gain: 6 }
    target: { type: own_city }
    costs: { ducats: 800 }
    resolution: { base_difficulty: 9, roll: 1d6 }
    outcomes:
      failure:
        - { effect: add_city_stat, stat: unrest, value: 3 }
      partial:
        - { effect: add_city_stat, stat: wealth, value: 1 }
      success:
        - { effect: add_city_stat, stat: wealth, value: 3 }
      critical:
        - { effect: add_city_stat, stat: wealth, value: 4 }
        - { effect: add_city_stat, stat: culture, value: 1 }
        - { effect: enqueue_event, tag: new_district_request }
    hooks: { event_candidates: [city_assignment], battle_modifiers: [], flags: [] }

  - id: cmd_fortify_walls
    name: Fortify Walls
    category: military
    ap_cost: 1
    actor: { required: true, slot: engineering, primary_stat: engineering, secondary_stat: command, fatigue_gain: 5 }
    target: { type: own_city }
    costs: { ducats: 650, grain: 80 }
    resolution: { base_difficulty: 8, roll: 1d6 }
    outcomes:
      failure:
        - { effect: add_city_stat, stat: unrest, value: 2 }
      partial:
        - { effect: add_city_stat, stat: fortification, value: 2 }
      success:
        - { effect: add_city_stat, stat: fortification, value: 5 }
        - { effect: add_battle_modifier, modifier: mod_defender_wall_bonus_small }
      critical:
        - { effect: add_city_stat, stat: fortification, value: 7 }
        - { effect: add_battle_modifier, modifier: mod_defender_wall_bonus_large }
    hooks: { event_candidates: [engineer_wall_event], battle_modifiers: [mod_defender_wall_bonus_small], flags: [] }

  - id: cmd_muster_militia
    name: Muster Militia
    category: military
    ap_cost: 1
    actor: { required: true, slot: council, primary_stat: command, secondary_stat: diplomacy, fatigue_gain: 5 }
    target: { type: own_city }
    costs: { grain: 120 }
    resolution: { base_difficulty: 7, roll: 1d6 }
    outcomes:
      failure:
        - { effect: add_city_stat, stat: unrest, value: 4 }
      partial:
        - { effect: add_garrison, value: 120 }
      success:
        - { effect: add_garrison, value: 260 }
      critical:
        - { effect: add_garrison, value: 340 }
        - { effect: add_resource, resource: prestige, value: 1 }
    hooks: { event_candidates: [militia_petition], battle_modifiers: [], flags: [] }

  - id: cmd_recruit_company
    name: Recruit Company
    category: military
    ap_cost: 1
    actor: { required: true, slot: council, primary_stat: diplomacy, secondary_stat: command, fatigue_gain: 4 }
    target: { type: own_city }
    costs: { ducats: 900 }
