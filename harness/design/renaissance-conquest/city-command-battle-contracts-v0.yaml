    hooks: { event_candidates: [relationship, recovery], battle_modifiers: [], flags: [] }

battle_schema:
  board:
    columns_per_side: 2
    lanes: [top, mid, bottom]
    ally_columns: [back, front]
    enemy_columns: [front, back]
  unit_state:
    required:
      - commander_id
      - troop_class
      - position
      - troops
      - morale
      - moves
      - delay
      - guard
      - capture_pressure
  battle_state:
    required:
      - attacker
      - defender
      - city
      - terrain
      - wall
      - advantage
      - round
      - turn_queue

battle_flow:
  - id: pre_battle
    inputs: [scout_modifiers, siege_modifiers, city_fortification, terrain]
    outputs: [visible_enemy_info, starting_advantage, wall_value]
  - id: deployment
    inputs: [available_commanders, troop_classes]
    outputs: [formation]
  - id: action_loop
    inputs: [turn_queue, battle_actions]
    outputs: [damage_events, morale_events, advantage_events, rout_events]
  - id: resolution
    inputs: [advantage, routed_units, objective_state, round_limit]
    outputs: [winner, battle_grade]
  - id: aftermath
    inputs: [routed_units, battle_grade, capture_pressure, city_state]
    outputs: [prisoners, wounds, loot, city_changes, event_candidates]

battle_actions:
  - id: action_strike
    name: Strike
    allowed_tags: [infantry, duelist]
    cost: { moves: 1 }
    timing: { preparation: none, recovery: 12 }
    targeting: { side: enemy, row: front, shape: single }
    effects:
      - { effect: damage, modifier: 1.0 }

  - id: action_brace
    name: Brace
    allowed_tags: [guard, anti_cavalry]
    cost: { moves: 1 }
    timing: { preparation: none, recovery: 10 }
    targeting: { side: ally, row: front, shape: self }
    effects:
      - { effect: guard, value: 35, duration: battle }
      - { effect: buff_vs_tag, tag: cavalry, value: 0.4, duration: battle }

  - id: action_volley
    name: Volley
    allowed_tags: [ranged]
    cost: { moves: 1 }
    timing: { preparation: none, recovery: 15 }
    targeting: { side: enemy, row: any, shape: single }
    effects:
      - { effect: damage, modifier: 0.85 }
      - { effect: morale_damage, value: 3 }

  - id: action_charge
    name: Charge
    allowed_tags: [cavalry]
    cost: { moves: 1 }
    timing: { preparation: none, recovery: 16 }
    targeting: { side: enemy, row: any, shape: single }
    effects:
      - { effect: damage, modifier: 1.35 }
      - { effect: self_risk_vs_tag, tag: anti_cavalry, value: 0.35 }

  - id: action_fire_by_rank
    name: Fire by Rank
    allowed_tags: [gunpowder, ranged]
    cost: { moves: 1 }
    timing: { preparation: none, recovery: 22 }
    targeting: { side: enemy, row: front, shape: single }
    effects:
      - { effect: damage, modifier: 1.55 }
      - { effect: debuff, stat: morale, value: -5 }

  - id: action_cannonade
    name: Cannonade
    allowed_tags: [siege, gunpowder]
    cost: { moves: 1 }
    timing: { preparation: interruptible, recovery: 26 }
    targeting: { side: enemy, row: front, shape: row }
    effects:
      - { effect: damage, modifier: 0.9 }
      - { effect: wall_damage, value: 12 }
      - { effect: advantage, value: 5 }

  - id: action_fieldworks
    name: Fieldworks
    allowed_tags: [engineer, support]
    cost: { moves: 1 }
    timing: { preparation: none, recovery: 14 }
    targeting: { side: ally, row: any, shape: row }
    effects:
      - { effect: guard, value: 20, duration: battle }
      - { effect: advantage, value: 3 }

  - id: action_cut_signal
    name: Cut Signal
    allowed_tags: [intrigue, interrupt]
    cost: { moves: 1 }
    timing: { preparation: none, recovery: 8 }
    targeting: { side: enemy, row: any, shape: single }
    effects:
      - { effect: interrupt, value: 1 }
      - { effect: advantage, value: 4 }

  - id: action_rally
    name: Rally
    allowed_tags: [morale, support]
    cost: { moves: 1 }
    timing: { preparation: none, recovery: 12 }
    targeting: { side: ally, row: any, shape: all }
    effects:
      - { effect: morale_heal, value: 8 }
      - { effect: advantage, value: 4 }

  - id: action_capture_push
    name: Capture Push
    allowed_tags: [intrigue, cavalry_flank, duelist]
    cost: { moves: 1 }
    timing: { preparation: none, recovery: 15 }
    targeting: { side: enemy, row: any, shape: single }
    effects:
      - { effect: damage, modifier: 0.35 }
      - { effect: capture_pressure, value: 25 }

after_battle_schema:
  routed_unit_check_order:
    - enemy_front_top
    - enemy_front_mid
    - enemy_front_bottom
    - enemy_back_top
    - enemy_back_mid
    - enemy_back_bottom
  capture:
    base_chance: 20
    capture_pressure_to_chance: "pressure * 0.5"
    max_prisoners_per_battle: 2
    blocked_if:
      - event_battle
      - uncapturable_commander
      - prison_full
      - faction_has_too_few_commanders
  wound:
    base_chance_when_routed: 25
    fatigue_multiplier: "1 + fatigue / 100"
  loot:
    victory_ducats: "city.wealth * 12"
    victory_grain: "city.wealth * 4"
    prestige_by_grade:
      decisive: 3
      normal: 2
      narrow: 1
      defeat: -2

battle_modifiers:
  - id: mod_scouted_enemy_small
    source: cmd_scout_neighbor
    duration: next_battle
    effects:
      - { effect: starting_advantage, value: 4 }
      - { effect: reveal_enemy_slots, value: 3 }

  - id: mod_scouted_enemy_large
    source: cmd_scout_neighbor
    duration: next_battle
    effects:
      - { effect: starting_advantage, value: 8 }
      - { effect: reveal_enemy_slots, value: 6 }

  - id: mod_siege_prep_standard
    source: cmd_prepare_siege
    duration: next_attack
    effects:
      - { effect: starting_advantage, value: 8 }
      - { effect: wall_damage_bonus, value: 0.25 }

  - id: mod_enemy_low_supplies
    source: cmd_sabotage_stores
    duration: next_attack
    effects:
      - { effect: enemy_morale, value: -8 }
      - { effect: enemy_garrison_multiplier, value: 0.9 }

  - id: mod_defender_wall_bonus_small
    source: cmd_fortify_walls
    duration: next_defense
    effects:
      - { effect: defender_starting_advantage, value: 5 }
      - { effect: wall_value, value: 10 }

mvp_slice:
  first_city_commands:
    - cmd_audit_ledgers
    - cmd_develop_district
    - cmd_fortify_walls
    - cmd_recruit_company
    - cmd_scout_neighbor
    - cmd_prepare_siege
    - cmd_sponsor_workshop
    - cmd_rest_officer
  first_battle_classes:
    - troop_pike_guard
    - troop_condottieri_swords
    - troop_crossbowmen
    - troop_cavalry_lancers
  first_battle_actions:
    - action_strike
    - action_brace
    - action_volley
    - action_charge
    - action_rally
    - action_capture_push
