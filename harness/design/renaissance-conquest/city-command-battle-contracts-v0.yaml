    outcomes:
      failure:
        - { effect: add_relation, value: -8 }
        - { effect: enqueue_event, tag: exposed_agent }
      partial:
        - { effect: damage_enemy_garrison, value: 80 }
      success:
        - { effect: damage_enemy_garrison, value: 180 }
        - { effect: add_battle_modifier, modifier: mod_enemy_low_supplies }
      critical:
        - { effect: damage_enemy_garrison, value: 260 }
        - { effect: add_battle_modifier, modifier: mod_enemy_low_supplies }
        - { effect: add_resource, resource: intel, value: 1 }
    hooks: { event_candidates: [political_scandal], battle_modifiers: [mod_enemy_low_supplies], flags: [] }

  - id: cmd_counterplot
    name: Counterplot
    category: intrigue
    ap_cost: 1
