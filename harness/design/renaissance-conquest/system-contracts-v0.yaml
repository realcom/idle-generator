formula_v0:
  effective_troops:
    description: "Troops scale down after thresholds to keep commanders and class identity relevant."
    expression:
      - "if troops <= 500: troops"
      - "elif troops <= 2000: troops * 0.5 + 250"
      - "else: troops * 0.25 + 750"

  attack_power:
    physical: "class.base_atk + commander.atk * 10 + commander.command * 3"
    defense: "target_class.base_def + target.def * 8"
    tactical: "class.base_int + commander.int * 10 + commander.command * 2"
    tactical_defense: "target.int * 7"

  damage:
    expression: >
      effective_troops * max(10, attack_power - defense_power) / 100
      * skill_modifier * terrain_modifier * morale_modifier

  advantage:
    start:
      field_defender: 0
      town_defender: 10
      fortified_city_defender: 20
      citadel_defender: 30
    events:
      enemy_unit_routed: 8
      ally_unit_routed: -8
      successful_scout: "3..12"
      siege_preparation: "5..20"
      morale_skill_minor: "5"
      morale_skill_major: "15"

mvp_targets:
  cities:
    - city_florence
    - city_pisa
    - city_siena
    - city_bologna
    - city_lucca
  factions:
    - faction_player_house
    - faction_medici_court
    - faction_papal_envoys
    - faction_condottieri_league
  counts:
    commanders: 30
    troop_classes: 8
    facilities: 8
    events: 100
    personal_chains_s_grade: 3
    personal_chains_a_grade: 5
