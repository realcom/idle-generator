  commander:
    - add_loyalty
    - add_ambition
    - add_fatigue
    - add_reputation
    - add_bond
    - add_trait
    - remove_trait
    - unlock_skill
    - change_contract
    - set_commander_flag
    - clear_commander_flag
    - wound_commander
    - release_prisoner
    - recruit_prisoner
  city:
    - add_city_stat
    - set_city_flag
    - clear_city_flag
    - add_facility
    - damage_facility
    - assign_commander
    - spawn_revolt
  faction:
    - add_resource
    - add_relation
    - declare_war
    - add_treaty
    - remove_treaty
    - set_route_flag
  battle:
