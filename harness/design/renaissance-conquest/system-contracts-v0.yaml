  commander:
    - commander_exists
    - commander_grade_is
    - commander_loyalty_lt
    - commander_loyalty_gte
    - commander_ambition_gte
    - commander_fatigue_gte
    - commander_has_trait
    - commander_missing_trait
    - commander_has_flag
    - commander_missing_flag
    - commander_assigned_to_city
    - commander_assigned_to_facility
    - commander_was_in_last_battle
    - commander_was_captured
    - commander_is_prisoner
  city:
    - city_owner_is
    - city_stat_lt
    - city_stat_gte
    - city_has_facility
    - city_missing_facility
    - city_has_flag
    - city_missing_flag
    - city_under_siege
  battle:
    - last_battle_result_is
    - last_battle_advantage_gte
    - last_battle_captured_count_gte
    - last_battle_commander_wounded
    - last_battle_city_is
  faction:
    - faction_resource_gte
