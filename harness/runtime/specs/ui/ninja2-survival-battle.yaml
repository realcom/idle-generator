validation:
  baseline:
    - "python3 harness/tools/phaser_smoke.py ninja2 --no-browser"
  browser:
    - "python3 harness/tools/phaser_smoke.py ninja2 --skip-compile --runtime harness/runtime/survivor-runtime.html --expect survivor --screenshot /tmp/ninja2-survivor-battle.png"
    - "python3 harness/tools/phaser_smoke.py ninja2 --skip-compile --runtime harness/runtime/survivor-runtime.html --expect survivor --query 'game=ninja2&mode=battle&levelup=demo&skilluse=demo&fullAssets=1' --timeout 140 --screenshot /tmp/ninja2-survivor-skilluse.png"
    - "python3 harness/tools/phaser_smoke.py ninja2 --skip-compile --runtime harness/runtime/survivor-runtime.html --expect survivor --query 'game=ninja2&mode=battle&vfx=demo' --timeout 120 --screenshot /tmp/ninja2-survivor-vfx.png"
    - "python3 harness/tools/phaser_smoke.py ninja2 --skip-compile --runtime harness/runtime/survivor-runtime.html --expect survivor --query 'game=ninja2&mode=battle&encounter=demo' --timeout 50 --screenshot /tmp/ninja2-survivor-encounters.png"
    - "python3 harness/tools/phaser_smoke.py ninja2 --skip-compile --runtime harness/runtime/survivor-runtime.html --expect survivor --query 'game=ninja2&mode=battle&loop=boss' --timeout 140 --screenshot /tmp/ninja2-survivor-loop.png"
    - "Open http://127.0.0.1:8765/harness/runtime/survivor-runtime.html?game=ninja2&mode=battle"
  screenshots:
    - /tmp/ninja2-survivor-battle.png
  checks:
    - "home and battle modes are nonblank"
    - "canvas is visible in battle mode"
    - "HUD, objective strip, joystick, dash control, profile skill icon rows, and EXP bar do not overlap at mobile width"
    - "profile skill icons stay readable in the top HUD: 24px at desktop/tablet width and no smaller than 20px at narrow mobile width"
    - "dataset survivorBattleReady=true after battle autostart"
    - "dataset survivorPlayerVisible=true after camera framing; player screen coordinates should stay inside the viewport center band"
    - "dataset survivorSkillVfxReady=true and survivorSkillVfxCount=16 after runtime boot"
    - "D1 runtime starts with only basic auto attack 300101 visible in the profile skill row; the first level-up choice pool is limited to 300102, 300103, and 300115"
    - "with ?levelup=demo&skilluse=demo&fullAssets=1, the smoke runner selects from the D1 level-up pool and verifies survivorRunSkillSpawnCount>=1, survivorRunSkillDamageCount>=1, survivorRunSkillDamageTotal>0, and survivorRunSkillFeedbackCount>=1"
    - "acquired run skill casts pulse the profile skill icon, show a short skill-cast chip in the HUD, and float the skill name near the player so usage is readable during combat"
    - "skilluse smoke also verifies survivorSkillIntentCueCount>=1 and survivorEnemyHitCueCount>=1 so acquired skills visibly target and impact monsters"
    - "nearby monsters draw lightweight pursuit cues and player damage draws a red danger ring, making monster contact readable as an interaction instead of background motion"
    - "D1 skill casts use generated ninja2.battle.skill_vfx.cast_atoms_d1_v1 PNG atoms from /battle/skill-vfx/ instead of relying only on Phaser Graphics placeholders"
    - "battle timer, kill, enemy, pickup, and boss/stage counters use generated ninja2.ui.battle_counter_icons_v1 PNG backgrounds from /battle-counters/"
    - "bomb, magnet, potion, and mine encounter pickups use generated ninja2.battle.encounter_icons.light_v1 PNG textures from /battle/encounters/ and render at lightweight in-world sizes"
    - "with ?vfx=demo, survivorAssetMode=generated-vfx-demo, survivorSkillVfxDemo reaches done, and survivorSkillVfxDemoFired=16"
    - "with ?encounter=demo, existing map update triggers publish encounter board variables 610/611/612, survivorEncounterTriggerSerial reaches >=4, bomb/magnet/potion are collected, the mine encounter reaches 3s hold completion, survivorEncounterMined>=1, and run resources increase"
    - "with ?loop=boss, the smoke runner auto-selects level choices, kills boss unit 110501, reaches player-win result mode, and renders non-empty reward rows"
    - "with ?loop=boss, the result screen uses a large 맵 클리어 status header with run stat chips above the reward list, and persisted reward deltas include both resources and itemInventory rewards"
    - "main character walk cycle animates while moving"
    - "generated common monster sprites render in battle with left/right side mirroring"
    - "battle resource ledger and run drop sprites render the generated coin, soulflame, wood, and stone PNGs instead of CSS/Graphics placeholder shapes"
    - "bottom-right dash control renders generated ninja2.ui.battle_dash_icon_v1, Space/click updates survivorDashLastSource, and cooldown ring/number follow survivorDashCooldownProgress"
    - "dash invulnerability blocks incoming player damage during the short dash window and updates survivorDashBlockedDamageCount"
