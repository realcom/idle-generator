version: "1.0"
game: ninja2
slug: ninja2-survival-battle
status: implemented

target_runtime:
  page: harness/runtime/survivor-runtime.html
  entrypoint: harness/runtime/src/survivor/survivor-app.js
  implementation_mode: hybrid
  fixture_urls:
    - harness/runtime/survivor-runtime.html?game=ninja2
    - harness/runtime/survivor-runtime.html?game=ninja2&mode=battle
    - harness/runtime/survivor-runtime.html?game=ninja2&mode=battle&levelChoice=off
    - harness/runtime/survivor-runtime.html?game=ninja2&mode=battle&levelChoice=off&battleVisual=polish
    - harness/runtime/survivor-runtime.html?game=ninja2&mode=battle&levelup=demo&skilluse=demo&fullAssets=1
    - harness/runtime/survivor-runtime.html?game=ninja2&mode=battle&vfx=demo
    - harness/runtime/survivor-runtime.html?game=ninja2&mode=battle&encounter=demo

source_design:
  concepts:
    - harness/design/ninja2/concepts/ninja2_survival_visual_runtime_polish_f.md
    - harness/design/ninja2/concepts/ninja2_rulelocked_survival_battle_a.md
    - harness/design/ninja2/concepts/ninja2_survival_visual_flat_runtime_b.md
    - harness/design/ninja2/concepts/ninja2_casual_sanctuary_survival_screen_a.md
  selected_runtime_target: "ninja2_survival_visual_runtime_polish_f is the default in-game combat target; rulelocked_survival_battle_a remains the orientation/readability invariant, and flat_runtime_b is the fallback if density harms mobile clarity."
  tokens:
    - harness/design/ninja2/art-direction.yaml
    - harness/design/ninja2/layout-tokens.yaml
    - harness/design/ninja2/component-skins.yaml
    - harness/design/ninja2/asset-plan.yaml

data_contract:
  sources:
    content:
      - "Compiled Maps.json provides the active map, wave metadata, reward groups, and popupArgs.ClientWaveCount."
      - "Compiled Units.json provides player, enemy, and boss combat stats consumed by IdlezBoard."
      - "Compiled Skills.json provides the run skill pool and cooldown/effect metadata."
      - "Compiled Items.json provides reward item names, categories, and resource ids."
      - "Compiled Triggers.json provides the map wave trigger graph used by the board kernel."
    runtime_state:
      - "globalThis.__IDLEZ_SURVIVOR_BOARD__ exposes live tick, enemy, kill, HP, drop, and end-game state for smoke checks."
      - "globalThis.__IDLEZ_SURVIVOR__ owns transient UI state for level choice, VFX demos, encounter demos, and result fixtures."
      - "document.documentElement.dataset.survivor* exposes the browser-smoke contract."
    design_assets:
      - "harness/design/ninja2/asset-plan.yaml maps generated HUD, encounter, skill VFX, and run-result assets to runtime paths."
  bindings:
    combat:
      map_selection: "query map=<id> or default START_MAP_ID until main-map selection fully moves to compiled/scenario data."
      board_state: "IdlezBoard Units/Skills/Triggers drive combat entities, attacks, drops, wave progress, and boss clear/defeat."
      run_skills: "Compiled Skills.json feeds level-up choices and profile skill chips."
      reward_ledger: "Compiled item ids and run drop state render resource chips and result reward rows."
      generated_assets: "Asset plan paths bind battle controls, encounter pickups, skill VFX atoms, and result overlays."
  fixtures:
    home: "harness/runtime/survivor-runtime.html?game=ninja2"
    battle: "harness/runtime/survivor-runtime.html?game=ninja2&mode=battle"
    battle_visual_capture: "harness/runtime/survivor-runtime.html?game=ninja2&mode=battle&levelChoice=off"
    battle_visual_polish: "harness/runtime/survivor-runtime.html?game=ninja2&mode=battle&levelChoice=off&battleVisual=polish"
    skill_use: "harness/runtime/survivor-runtime.html?game=ninja2&mode=battle&levelup=demo&skilluse=demo&fullAssets=1"
    vfx: "harness/runtime/survivor-runtime.html?game=ninja2&mode=battle&vfx=demo"
    encounter: "harness/runtime/survivor-runtime.html?game=ninja2&mode=battle&encounter=demo"

screen:
  orientation: portrait_9_16
  responsive_policy:
    stage: "Phaser Scale.RESIZE, fills viewport"
    max_reference_width_px: 440
    min_height_px: 560
  safe_area_policy: "DOM HUD uses env(safe-area-inset-*) on all edge regions."

regions:
  phaser_canvas:
    combat_arena:
      world_size_px: { width: 3000, height: 2000 }
      camera: "orthographic top-down camera follows player"
      center_clear_radius_px: 110
      ground: "procedural moss and dirt bands with generated PNG forest props for lantern posts, bamboo clumps, moss stones, fallen logs, and soul shrines"
      runtime_polish_f_contract:
        field_density: "Richer moss/dirt decals and edge vegetation frame the view while leaving a readable circular combat lane around the hero."
        hero_focus: "A warm lantern aura, inner readability ring, and short golden slash arcs keep the guardian visually centered during mob pressure."
        pickups: "EXP/resource drops use generated resource sprites where available, plus native glow/ring/shadow layers and short idle pulse."
        elite_boss_warning: "Boss and elite units get a red-orange telegraph halo, vertical threat line, and boss-stage cue without obscuring HP bars or player input."
        fallback: "When performance or readability fails, drop decorative ground speckles first, then pickup glows, but preserve hero aura and telegraph semantics."
      units: "IdlezBoard-triggered player, enemy waves, boss, projectiles, drops"
  dom_overlay:
    top_hud:
      left: "hero portrait, HP bar, level, kills, and a compact skill row; start state shows only the basic 300101 auto attack, then acquired run skills replace the row"
      center: "stage label and timer"
      right: "actual run resource ledger for wood, stone, soulflame, and gold; each chip starts at 0 and pulses a +gain badge only when that resource is collected"
      progress: "8-segment wave track, filled from current wave progress"
    objective_strip:
      content: "current wave objective, live enemy count, pickup count"
      placement: "under top HUD, narrow centered pill"
    controls:
      joystick: "bottom-left translucent touch affordance"
      dash_button: "bottom-right single dash control using the generated dash icon; Space/click triggers a 5s-cooldown forward invulnerable dash, with cooldown shown by native ring and large numeric countdown"
      exp_bar: "bottom EXP bar with fixed badge"
    run_result:
      source_concepts:
        - harness/design/ninja2/concepts/ninja2_run_result_clear_concept_a.md
        - harness/design/ninja2/concepts/ninja2_run_result_defeat_concept_a.md
      hierarchy: "result state first, rewards second"
      shell: "single parchment modal over the dimmed battle field; do not bake the generated concept PNG into runtime"
      assetization:
        generated:
          - ninja2.ui.run_result.battle_backdrop_v1
          - ninja2.ui.run_result.hero_overlays_v1
          - ninja2.ui.run_result.status_slabs_v1
          - ninja2.ui.run_result.reward_header_brush_v1
          - ninja2.ui.run_result.return_button_9slice_v1
        reuse:
          - ninja2.ui.panel.parchment_9slice
          - ninja2.ui.sanctuary_build.frame_ornaments_v1
          - existing resource/reward icon sprites
        native_ui:
          - title text
          - stage kicker
          - stat chips
          - reward row labels and amounts
      status_header:
        victory_title: "맵 클리어"
        defeat_title: "패배"
        height_ratio_of_modal: "35-40%"
        content: "shared modal ornament, stage kicker, huge title, and 2-3 compact run stat chips"
        victory_material: "fixed overhanging dark walnut sign hero overlay with lantern-gold trim and side lantern accents, paired with reused sanctuary-build frame_crest ornament; not 9-slice"
        defeat_material: "fixed overhanging parchment hero overlay with muted torn red cloth/ribbon, paired with reused sanctuary-build frame_crest ornament; not 9-slice"
      rewards:
        placement: "below the status header as a separate 획득 보상 section"
        section_title: "clear state uses generated dark brush title background with native text"
        row_contract: "native parchment ledger row: left icon medallion, native label, bold native amount, and small trailing reused reward icon"
        max_visible_rows: 7
        persistence: "display only rewards that are persisted to sanctuary state, including non-resource itemInventory entries"
        asset_policy: "rows stay native UI unless a later row-skin concept requires generated texture; do not bake item names or reward amounts"
      footer: "one primary orange 성소로 귀환 button"

