version: "1.0"
game: ninja2
slug: home-modals/shop
status: implemented

target_runtime:
  page: harness/runtime/survivor-runtime.html
  entrypoint: harness/runtime/src/survivor/survivor-app.js
  module: harness/runtime/src/survivor/home-modals/shop.js
  fixture_urls:
    - harness/runtime/survivor-runtime.html?game=ninja2&fixture=city&tab=shop

target_godot:
  project: harness/runtime/godot-ninja2/project.godot
  owner_script: harness/runtime/godot-ninja2/scripts/home/modals/shop_tab_modal.gd
  recipe: harness/godot/recipes/ui/ninja2-home-shop-modal.yaml
  generated_scene: harness/runtime/godot-ninja2/scenes/generated/home_shop_modal.tscn
  generated_theme: harness/runtime/godot-ninja2/themes/generated/ninja2_home_shop_modal.tres
  fixture_capture: harness/runtime/godot-ninja2/scripts/tools/capture_tab_modals.gd
  screenshots:
    runtime: harness/runtime/godot-ninja2/screenshots/godot-ninja2-tab-shop.png
    compare: harness/runtime/godot-ninja2/screenshots/compare/godot-home-shop-modal-vs-concept-c.png

source_design:
  primary_concept:
    - harness/design/ninja2/concepts/home-modals/shop/concept-c.md
  supporting_concept:
    - harness/design/ninja2/concepts/home-modals/shop/concept-b.md
  modal_family:
    - harness/design/ninja2/concepts/ninja2_phaser_modal_system_a.md
    - harness/design/ninja2/concepts/ninja2_sanctuary_build_modal_a.md
  sibling_modal:
    - harness/design/ninja2/concepts/home-modals/mission/concept-a.md

runtime_contract:
  - "The bottom 상점 tab opens #homeShopModal instead of rendering products inside #homeFeatureScreen."
  - "#homeShopModal reuses the home modal shell contract: home-modal-host, home-modal-shell, home-modal-header, home-modal-body, home-modal-footer, scrim, crest, corner ornaments, and a visible X close button."
  - "The shop is a cash-payment product mockup. Product cards mirror Product items 201501-201504 from harness/content/ninja2/items/_drafts and use generated product icons from ninja2.ui.shop_product_icons.cash_v1."
  - "The modal follows concept-c: five category tabs, a prominent timed-deal hero with discount ribbon/countdown, a two-column card grid, and compact quick-purchase rows."
  - "Product names, descriptions, KRW/USD prices, reward quantities, entitlement states, and button labels remain native DOM text."
  - "Godot ShopTabModal mirrors the same structure with native Control nodes: category tabs, timed-deal hero, scrollable two-column card grid, pass teaser, quick rows, and a footer status bar."
  - "Available, owned/claimed, locked, and preview states must be visible in card/quick-row class names and styling."
  - "Clicking X or the scrim closes the shop modal and returns to the sanctuary tab."
  - "Buying a product in the harness simulates test-payment success, updates sanctuary rewards/shopClaims, data-homeShopAvailableCount, and rerenders the modal."

data_contract:
  sources:
    content:
      - "Product items 201501-201504 in harness/content/ninja2/items/_drafts define the cash shop IDs, iapIdentifier values, real-money prices, addItemGroups, and spriteGroups.Icon."
    design_assets:
      - "harness/design/ninja2/asset-plan.yaml:ninja2.ui.shop_product_icons.cash_v1 defines the generated product icon atoms."
    runtime_state:
      - "scene.sanctuary.shopClaims stores owned one-time product keys for the local Phaser prototype."
      - "scene.sanctuary ruby/freeRuby/energy/adRemoval fields store harness-only simulated purchase rewards."
      - "Godot SanctuaryState.shop_claims stores owned one-time product keys and try_claim_shop_product applies Product addItemGroups during local smoke tests."
  bindings:
    shop_modal:
      selected_tab: "query tab=shop or HOME_TAB_KEYS state"
      category_tabs: "HOME_SHOP_CATEGORY_TABS exposes featured, packs, ruby, energy, and pass buckets; query shopCategory selects the initial bucket."
      featured_banner: "HOME_SHOP_PRODUCT_DEFS.featured/timedDeal marks the starter pack as the timed-deal hero."
      product_cards: "HOME_SHOP_PRODUCT_DEFS mirrors Product item ids 201501-201504 until the home modal reads compiled Items.json Product rows directly."
      quick_rows: "HOME_SHOP_PRODUCT_DEFS.quick marks products repeated in the compact quick-purchase list."
      pass_teaser: "A pass preview card reserves the pass category until Product content exists for it."
      icon_assets:
        201501: harness/runtime/assets/ninja2/ui/shop/shop_product_ruby_pouch.png
        201502: harness/runtime/assets/ninja2/ui/shop/shop_product_starter_pack.png
        201503: harness/runtime/assets/ninja2/ui/shop/shop_product_energy_refill.png
        201504: harness/runtime/assets/ninja2/ui/shop/shop_product_ad_removal_charm.png
  fixtures:
    city: "harness/runtime/survivor-runtime.html?game=ninja2&fixture=city&tab=shop"

validation:
  static:
    - "node --check harness/runtime/src/survivor/survivor-app.js"
    - "node --check harness/runtime/src/survivor/home-modals/shop.js"
    - "python3 harness/godot/validators/godot_ui_recipe_validate.py --recipe harness/godot/recipes/ui/ninja2-home-shop-modal.yaml --strict"
    - "godot --headless --path harness/runtime/godot-ninja2 --check-only --script res://scripts/home/modals/shop_tab_modal.gd"
  smoke:
    - "python3 harness/tools/phaser_smoke.py ninja2 --skip-compile --runtime harness/runtime/survivor-runtime.html --expect survivor --query 'game=ninja2&fixture=city&tab=shop' --screenshot /tmp/ninja2-home-shop-modal.png --timeout 120"
    - "godot --headless --path harness/runtime/godot-ninja2 --script res://scripts/tools/home_tabs_smoke.gd"
    - "godot --path harness/runtime/godot-ninja2 --script res://scripts/tools/capture_tab_modals.gd"
  browser_checks:
    - "data-home-shop-modal-open is true after clicking the 상점 bottom tab."
    - "#homeShopModal .home-build-modal-close is visible."
    - "Five .home-shop-category-tab controls render and switching tabs updates the active category without closing the modal."
    - "#homeShopModal .home-shop-timed-deal renders for the featured/packs categories with a discount ribbon and countdown."
    - "At least four .home-shop-card entries render for the featured city fixture with generated product icon images."
    - "At least three .home-shop-quick-row entries render in the featured city fixture."
    - "Buying a one-time cash product updates available count, marks the product owned, and remains inside the modal."
