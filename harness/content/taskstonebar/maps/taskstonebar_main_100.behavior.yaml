name: TaskstonebarSet01Update
domain: map

vars:
  enemy_team: { type: int, default: 4 }
  wave_transition_pending: { type: int, default: 603 }

"on":
  - event: update
    every: 1s
    do:
      - when: "waveTransitionPending == 1"
        SetBoardVariable: { key: $wave_transition_pending, value: 0 }

      - GetUnitCountByTeam: { team: $enemy_team }
      - when: "waveTransitionPending == 0 and wave == 1 and return == 0"
        SetBoardVariable: { key: $wave_transition_pending, value: 1 }
        SetWave: { value: 2 }
        SendWaveQueuedEvent: { name: MAP_ONSTART_TASKSTONEBARSET01WAVE2 }

      - GetUnitCountByTeam: { team: $enemy_team }
      - when: "waveTransitionPending == 0 and wave == 2 and return == 0"
        SetBoardVariable: { key: $wave_transition_pending, value: 1 }
        SetWave: { value: 3 }
        SendWaveQueuedEvent: { name: MAP_ONSTART_TASKSTONEBARSET01WAVE3 }

      - GetUnitCountByTeam: { team: $enemy_team }
      - when: "waveTransitionPending == 0 and wave == 3 and return == 0"
        SetBoardVariable: { key: $wave_transition_pending, value: 1 }
        SetWave: { value: 4 }
        SendWaveQueuedEvent: { name: MAP_ONSTART_TASKSTONEBARSET01WAVE4 }

      - GetUnitCountByTeam: { team: $enemy_team }
      - when: "waveTransitionPending == 0 and wave == 4 and return == 0"
        SetBoardVariable: { key: $wave_transition_pending, value: 1 }
        SetWave: { value: 5 }
        SendWaveQueuedEvent: { name: MAP_ONSTART_TASKSTONEBARSET01MINIBOSS }

      - GetUnitCountByTeam: { team: $enemy_team }
      - when: "waveTransitionPending == 0 and wave == 5 and return == 0"
        EndGame: { result: win }
