        SetWave: { value: 3 }
        SendWaveQueuedEvent: { name: MAP_ONSTART_TASKSTONEBARSET05LONGWAVE3 }

      - GetUnitCountByTeam: { team: $enemy_team }
      - when: "waveTransitionPending == 0 and wave == 3 and return == 0"
        SetBoardVariable: { key: $wave_transition_pending, value: 1 }
        SetWave: { value: 4 }
        SendWaveQueuedEvent: { name: MAP_ONSTART_TASKSTONEBARSET05LONGWAVE4 }

      - GetUnitCountByTeam: { team: $enemy_team }
      - when: "waveTransitionPending == 0 and wave == 4 and return == 0"
        SetBoardVariable: { key: $wave_transition_pending, value: 1 }
        SetWave: { value: 5 }
        SendWaveQueuedEvent: { name: MAP_ONSTART_TASKSTONEBARSET05LONGWAVE5 }

      - GetUnitCountByTeam: { team: $enemy_team }
      - when: "waveTransitionPending == 0 and wave == 5 and return == 0"
        SetBoardVariable: { key: $wave_transition_pending, value: 1 }
        SetWave: { value: 6 }
        SendWaveQueuedEvent: { name: MAP_ONSTART_TASKSTONEBARSET05GIANTBOSS }

      - GetUnitCountByTeam: { team: $enemy_team }
      - when: "waveTransitionPending == 0 and wave == 6 and return == 0"
        EndGame: { result: win }
