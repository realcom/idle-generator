name: TaskstonebarSet01Wave1
domain: map

vars:
  basic_unit: { type: int, default: 111011 }
  fast_unit: { type: int, default: 111012 }
  ranged_unit: { type: int, default: 111013 }
  armored_unit: { type: int, default: 111014 }
  miniboss_unit: { type: int, default: 111015 }

  enemy_team: { type: int, default: 4 }
  enemy_spawn: { type: int, default: 101 }
  wave_spawned: { type: int, default: 604 }

"on":
  - event: start
    do:
      - SetBoardState: { value: Playing }
      - SetWave: { value: 1 }
      - SetBoardVariable: { key: $wave_spawned, value: 0 }
      - SendWaveStartedEvent: {}
      - AddUnit:
          unitDataId: $basic_unit
          count: 7
          level: enemyLevel
          team: $enemy_team
          locationId: $enemy_spawn
      - SetBoardVariable: { key: $wave_spawned, value: 7 }
