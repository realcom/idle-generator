---
name: TaskstonebarGiantCrush
domain: unit

"on":
  - event: update
    every: 4.2s
    do:
      - getCurrentHpPercent: {}
      - when: "return <= 35"
        useSkillToTarget: { skillDataId: 300208 }
      - when: "return > 35 and return <= 70"
        useSkillToTarget: { skillDataId: 300207 }
      - when: "return > 70"
        useSkillToTarget: { skillDataId: 300206 }
