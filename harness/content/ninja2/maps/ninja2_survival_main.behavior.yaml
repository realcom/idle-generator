# Main-stage pressure: map enemy levels jump nonlinearly, and each wave adds
# enough level/count pressure to make late waves visibly crowded and tanky.
name: Ninja2MainWave1
domain: map
"on":
  - event: start
    do:
      - SetBoardState: { value: Playing }
      - SetWave: { value: 1 }
      - SetBoardVariable: { key: 603, value: 0 }
      - SetBoardVariable: { key: 604, value: 18 }
      - SetBoardVariable: { key: 613, value: 6 }
      - SetBoardVariable: { key: 610, value: 0 }
      - SetBoardVariable: { key: 611, value: 0 }
      - SetBoardVariable: { key: 612, value: 0 }
      - SendWaveStartedEvent: {}
      - AddUnit: { unitDataId: 110201, count: 6, level: enemy_level, team: enemy, locationId: 1 }

