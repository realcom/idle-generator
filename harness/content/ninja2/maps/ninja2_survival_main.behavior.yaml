name: Ninja2MainWaves3Update
domain: map
"on":
  - event: update
    every: 1s
    do:
      - when: "waveTransitionPending == 1"
        SetBoardVariable: { key: 603, value: 0 }
      - when: "encounter_demo_step == 0 and tick % 210 == 0"
        do:
          - SetBoardVariable: { key: 611, value: "board.RandomIntBetween(1, 4)" }
          - SetBoardVariable: { key: 610, value: "encounter_serial + 1" }
      - when: "encounter_demo_step == 1"
        do:
          - SetBoardVariable: { key: 611, value: 1 }
          - SetBoardVariable: { key: 612, value: 101 }
          - SetBoardVariable: { key: 610, value: "encounter_serial + 1" }
      - when: "encounter_demo_step == 2"
        do:
          - SetBoardVariable: { key: 611, value: 2 }
          - SetBoardVariable: { key: 612, value: 102 }
          - SetBoardVariable: { key: 610, value: "encounter_serial + 1" }
      - when: "encounter_demo_step == 3"
        do:
          - SetBoardVariable: { key: 611, value: 3 }
          - SetBoardVariable: { key: 612, value: 103 }
          - SetBoardVariable: { key: 610, value: "encounter_serial + 1" }
      - when: "encounter_demo_step == 4"
        do:
          - SetBoardVariable: { key: 611, value: 4 }
          - SetBoardVariable: { key: 612, value: 104 }
          - SetBoardVariable: { key: 610, value: "encounter_serial + 1" }
      - GetUnitCountByTeam: { team: enemy }
      - when: "waveTransitionPending == 0 and wave == 1 and wave_spawn_issued < wave_spawned and return < 28"
        do:
          - AddUnit: { unitDataId: 110201, count: 6, level: enemy_level, team: enemy, locationId: 1 }
          - SetBoardVariable: { key: 613, value: "wave_spawn_issued + 6" }
      - GetUnitCountByTeam: { team: enemy }
      - when: "waveTransitionPending == 0 and wave == 2 and wave_spawn_issued < wave_spawned and return < 34"
        do:
          - AddUnit: { unitDataId: 110201, count: 5, level: "enemy_level + 4", team: enemy, locationId: 1 }
          - AddUnit: { unitDataId: 110202, count: 3, level: "enemy_level + 4", team: enemy, locationId: 1 }
          - SetBoardVariable: { key: 613, value: "wave_spawn_issued + 8" }
      - GetUnitCountByTeam: { team: enemy }
      - when: "waveTransitionPending == 0 and wave == 3 and wave_spawn_issued < wave_spawned and return < 42"
        do:
          - AddUnit: { unitDataId: 110201, count: 4, level: "enemy_level + 8", team: enemy, locationId: 1 }
          - AddUnit: { unitDataId: 110202, count: 5, level: "enemy_level + 8", team: enemy, locationId: 1 }
          - AddUnit: { unitDataId: 110203, count: 3, level: "enemy_level + 8", team: enemy, locationId: 1 }
          - SetBoardVariable: { key: 613, value: "wave_spawn_issued + 12" }
      - GetUnitCountByTeam: { team: enemy }
      - when: "waveTransitionPending == 0 and wave == 1 and wave_spawn_issued >= wave_spawned and return == 0"
        SetBoardVariable: { key: 603, value: 1 }
        SetWave: { value: 2 }
        SendWaveQueuedEvent: { name: MAP_ONSTART_NINJA2MAINWAVE2 }
      - GetUnitCountByTeam: { team: enemy }
      - when: "waveTransitionPending == 0 and wave == 2 and wave_spawn_issued >= wave_spawned and return == 0"
        SetBoardVariable: { key: 603, value: 1 }
        SetWave: { value: 3 }
        SendWaveQueuedEvent: { name: MAP_ONSTART_NINJA2MAINBOSSWAVE3 }
      - GetUnitCountByTeam: { team: enemy }
      - when: "waveTransitionPending == 0 and wave == 3 and wave_spawn_issued >= wave_spawned and return == 0 and board.GetUnitCount(110501) == 0"
        SetBoardVariable: { key: 603, value: 2 }
        AddUnit: { unitDataId: 110501, count: 1, level: "boss_level + 8", team: enemy, locationId: 1 }
      - GetUnitCountByTeam: { team: enemy }
      - when: "waveTransitionPending == 2 and wave == 3 and return == 0 and board.GetUnitCount(110501) == 0"
        EndGame: { result: win }

