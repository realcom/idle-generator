version: 1
game: taskstonebar
status: review
source_policy: Existing Growstone2 runtime/raw monster sprites are used directly for active Taskstonebar units; generated/static cutouts and single-frame stationary dummy sheets are excluded from active monster candidates.
animation_contract: Active Taskstonebar monster sprite paths point directly to original curated runtime sheets; candidates must provide at least two move frames, and metadata stores frame rects only without copying, tinting, cropping, or repacking source pixels.
orientation_contract: Original monster sheet frame direction is preserved. Godot applies render_flip_h only when animation metadata explicitly asks for it; Taskstonebar source monsters currently render without destructive file flips.
orientation_fix:
  date: 2026-06-29
  action: Replaced generated animated-sheet references with original runtime source sprite paths and moved direction handling into metadata.
